# station tasks. Depends on core; styles.css ships as-is and is read by
# the test suite's asset checks.

[tasks.build]
extends = "pkg:build"
depends = ["//core:build"]
sources = ["src/**", "tsdown.config.ts", "package.json", "../pnpm-lock.yaml", "../core/dist/**"]

[tasks.typecheck]
extends = "pkg:typecheck"
sources = [
  "src/**",
  "test/**",
  "tsconfig.json",
  "package.json",
  "../pnpm-lock.yaml",
  "../core/dist/**",
]

[tasks.tests]
extends = "pkg:tests"
hide = true
sources = [
  "src/**",
  "test/**",
  "schema/**",
  "styles.css",
  "vitest.config.ts",
  "tsconfig.json",
  "package.json",
  "../pnpm-lock.yaml",
  "../core/dist/**",
]

[tasks.test]
extends = "pkg:test"
raw_args = true

[tasks.check]
description = "station typecheck + tests"
depends = ["typecheck", "tests"]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 968">
  <defs>
    <marker id="adapt-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2f454a"/>
    </marker>
  </defs>

  <!-- ground -->
  <rect x="0" y="0" width="720" height="968" fill="#fffdf8"/>

  <!-- column headers -->
  <text x="24" y="40" fill="#40565a" font-size="12" font-weight="700" font-family="'IBM Plex Mono', monospace" letter-spacing="0.1em">VENDOR UPSTREAMS</text>
  <text x="24" y="58" fill="#40565a" font-size="12" font-style="italic" font-family="'IBM Plex Sans', sans-serif">each its own shape + units</text>
  <text x="240" y="40" fill="#40565a" font-size="12" font-weight="700" font-family="'IBM Plex Mono', monospace" letter-spacing="0.1em">PER-VENDOR ADAPTERS</text>
  <text x="240" y="58" fill="#40565a" font-size="12" font-style="italic" font-family="'IBM Plex Sans', sans-serif">meta: identity + capabilities, from config alone</text>
  <text x="240" y="74" fill="#40565a" font-size="12" font-style="italic" font-family="'IBM Plex Sans', sans-serif">load: fetch -&gt; validate -&gt; normalize</text>

  <!-- fan-in: each adapter feeds one bus down into the contract (drawn before boxes) -->
  <path d="M624 126 H660" fill="none" stroke="#2f454a" stroke-width="1.2"/>
  <path d="M624 212 H660" fill="none" stroke="#2f454a" stroke-width="1.2"/>
  <path d="M624 298 H660" fill="none" stroke="#2f454a" stroke-width="1.2"/>
  <path d="M624 384 H660" fill="none" stroke="#2f454a" stroke-width="1.2"/>
  <path d="M624 470 H660" fill="none" stroke="#2f454a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <path d="M660 126 V384" fill="none" stroke="#2f454a" stroke-width="1.2"/>
  <path d="M660 384 V544" fill="none" stroke="#2f454a" stroke-width="1.2" marker-end="url(#adapt-arrow)"/>
  <text x="652" y="530" fill="#40565a" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="end" letter-spacing="0.02em">normalized Station</text>

  <!-- ===== lane 1: WindNerd ===== -->
  <rect x="24" y="88" width="600" height="76" rx="6" fill="#fffdf8" stroke="#776956" stroke-width="1"/>
  <rect x="25" y="89" width="199" height="74" rx="5" fill="#f2f4f1"/>
  <line x1="224" y1="89" x2="224" y2="163" stroke="rgba(119,105,86,0.4)" stroke-width="0.8"/>
  <text x="36" y="112" fill="#152529" font-size="14" font-weight="600" font-family="'IBM Plex Sans', sans-serif">WindNerd</text>
  <text x="36" y="130" fill="#40565a" font-size="12" font-family="'IBM Plex Mono', monospace">records API + live</text>
  <rect x="36" y="138" width="40" height="18" rx="2" fill="#fffdf8" stroke="rgba(119,105,86,0.7)" stroke-width="0.8"/>
  <text x="56" y="151" fill="#2f454a" font-size="12" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">m/s</text>
  <text x="240" y="112" fill="#152529" font-size="13" font-weight="600" font-family="'IBM Plex Mono', monospace">vendor: "windnerd"</text>
  <text x="240" y="134" fill="#2f454a" font-size="13" font-family="'IBM Plex Sans', sans-serif">validates speeds 0-140 m/s</text>
  <text x="240" y="152" fill="#2f454a" font-size="13" font-family="'IBM Plex Sans', sans-serif">live INIT enriches meta — config wins</text>

  <!-- ===== lane 2: Tempest ===== -->
  <rect x="24" y="174" width="600" height="76" rx="6" fill="#fffdf8" stroke="#776956" stroke-width="1"/>
  <rect x="25" y="175" width="199" height="74" rx="5" fill="#f2f4f1"/>
  <line x1="224" y1="175" x2="224" y2="249" stroke="rgba(119,105,86,0.4)" stroke-width="0.8"/>
  <text x="36" y="198" fill="#152529" font-size="14" font-weight="600" font-family="'IBM Plex Sans', sans-serif">Tempest</text>
  <text x="36" y="216" fill="#40565a" font-size="12" font-family="'IBM Plex Mono', monospace">swd.weatherflow.com</text>
  <rect x="36" y="224" width="40" height="18" rx="2" fill="#fffdf8" stroke="rgba(119,105,86,0.7)" stroke-width="0.8"/>
  <text x="56" y="237" fill="#2f454a" font-size="12" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">m/s</text>
  <text x="240" y="198" fill="#152529" font-size="13" font-weight="600" font-family="'IBM Plex Mono', monospace">vendor: "tempest"</text>
  <text x="240" y="220" fill="#2f454a" font-size="13" font-family="'IBM Plex Sans', sans-serif">validates speeds 0-140 m/s</text>
  <text x="240" y="238" fill="#2f454a" font-size="13" font-family="'IBM Plex Sans', sans-serif">fills every field of conditions</text>

  <!-- ===== lane 3: Campbell ===== -->
  <rect x="24" y="260" width="600" height="76" rx="6" fill="#fffdf8" stroke="#776956" stroke-width="1"/>
  <rect x="25" y="261" width="199" height="74" rx="5" fill="#f2f4f1"/>
  <line x1="224" y1="261" x2="224" y2="335" stroke="rgba(119,105,86,0.4)" stroke-width="0.8"/>
  <text x="36" y="284" fill="#152529" font-size="14" font-weight="600" font-family="'IBM Plex Sans', sans-serif">Campbell</text>
  <text x="36" y="302" fill="#40565a" font-size="12" font-family="'IBM Plex Mono', monospace">DataQuery · no cloud</text>
  <rect x="36" y="310" width="48" height="18" rx="2" fill="#fffdf8" stroke="rgba(119,105,86,0.7)" stroke-width="0.8"/>
  <text x="60" y="323" fill="#2f454a" font-size="12" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">km/h</text>
  <text x="240" y="284" fill="#152529" font-size="13" font-weight="600" font-family="'IBM Plex Mono', monospace">vendor: "campbell"</text>
  <text x="240" y="306" fill="#2f454a" font-size="13" font-family="'IBM Plex Sans', sans-serif">bounds 0-500 km/h, then kmhToMps</text>
  <text x="240" y="324" fill="#2f454a" font-size="13" font-family="'IBM Plex Sans', sans-serif">pinned field contracts, units checked</text>

  <!-- ===== lane 4: Ecowitt ===== -->
  <rect x="24" y="346" width="600" height="76" rx="6" fill="#fffdf8" stroke="#776956" stroke-width="1"/>
  <rect x="25" y="347" width="199" height="74" rx="5" fill="#f2f4f1"/>
  <line x1="224" y1="347" x2="224" y2="421" stroke="rgba(119,105,86,0.4)" stroke-width="0.8"/>
  <text x="36" y="370" fill="#152529" font-size="14" font-weight="600" font-family="'IBM Plex Sans', sans-serif">Ecowitt</text>
  <text x="36" y="388" fill="#40565a" font-size="12" font-family="'IBM Plex Mono', monospace">real_time · ~1/min</text>
  <rect x="36" y="396" width="90" height="18" rx="2" fill="#fffdf8" stroke="rgba(119,105,86,0.7)" stroke-width="0.8"/>
  <text x="81" y="409" fill="#2f454a" font-size="12" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">SI (pinned)</text>
  <text x="240" y="370" fill="#152529" font-size="13" font-weight="600" font-family="'IBM Plex Mono', monospace">vendor: "ecowitt"</text>
  <text x="240" y="392" fill="#2f454a" font-size="13" font-family="'IBM Plex Sans', sans-serif">request pins SI — defaults are imperial</text>
  <text x="240" y="410" fill="#2f454a" font-size="13" font-family="'IBM Plex Sans', sans-serif">validates speeds 0-140 m/s</text>

  <!-- ===== lane 5: Custom ===== -->
  <rect x="24" y="432" width="600" height="76" rx="6" fill="rgba(21,37,41,0.02)" stroke="rgba(21,37,41,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="224" y1="433" x2="224" y2="507" stroke="rgba(119,105,86,0.4)" stroke-width="0.8"/>
  <text x="36" y="456" fill="#152529" font-size="14" font-weight="600" font-family="'IBM Plex Sans', sans-serif">Custom</text>
  <text x="36" y="474" fill="#40565a" font-size="12" font-family="'IBM Plex Mono', monospace">any upstream</text>
  <rect x="36" y="482" width="84" height="18" rx="2" fill="#fffdf8" stroke="rgba(119,105,86,0.7)" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="78" y="495" fill="#2f454a" font-size="12" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">your units</text>
  <text x="240" y="456" fill="#152529" font-size="13" font-weight="600" font-family="'IBM Plex Mono', monospace">vendor: "custom"</text>
  <text x="240" y="478" fill="#2f454a" font-size="13" font-family="'IBM Plex Sans', sans-serif">your mapping — must return a valid Station</text>
  <text x="240" y="496" fill="#2f454a" font-size="13" font-family="'IBM Plex Sans', sans-serif">defineStationAdapter for the full belt</text>

  <!-- ===== the contract node (focal) ===== -->
  <rect x="24" y="548" width="672" height="132" rx="8" fill="#fffdf8"/>
  <rect x="24" y="548" width="672" height="132" rx="8" fill="rgba(145,59,12,0.06)" stroke="#913b0c" stroke-width="1.4"/>
  <rect x="40" y="562" width="130" height="20" rx="2" fill="none" stroke="rgba(145,59,12,0.5)" stroke-width="0.8"/>
  <text x="105" y="576" fill="#743008" font-size="12" font-weight="700" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WIRE CONTRACT</text>
  <text x="40" y="608" fill="#152529" font-size="15" font-weight="700" font-family="'IBM Plex Mono', monospace">Station</text>
  <text x="40" y="632" fill="#2f454a" font-size="13" font-family="'IBM Plex Sans', sans-serif">identity + capabilities, on both arms</text>
  <text x="40" y="650" fill="#2f454a" font-size="13" font-family="'IBM Plex Sans', sans-serif">status "ok" -&gt; reading + history</text>
  <text x="40" y="668" fill="#2f454a" font-size="13" font-family="'IBM Plex Sans', sans-serif">status "unavailable" -&gt; reason code</text>
  <text x="370" y="632" fill="#2f454a" font-size="13" font-family="'IBM Plex Sans', sans-serif">speeds in m/s · null, never zero</text>
  <text x="370" y="650" fill="#2f454a" font-size="13" font-family="'IBM Plex Sans', sans-serif">capabilities declared, never inferred</text>

  <!-- contract -> handler -->
  <path d="M190 680 V768" fill="none" stroke="#2f454a" stroke-width="1.2" marker-end="url(#adapt-arrow)"/>

  <!-- callout under the contract -->
  <text x="440" y="704" fill="#2f454a" font-size="13" font-style="italic" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Whatever the hardware, the client sees one document.</text>

  <!-- ===== downstream zone ===== -->
  <rect x="24" y="718" width="672" height="144" rx="8" fill="rgba(21,37,41,0.02)" stroke="rgba(119,105,86,0.45)" stroke-width="1"/>
  <text x="680" y="740" fill="#40565a" font-size="12" font-weight="700" font-family="'IBM Plex Mono', monospace" text-anchor="end" letter-spacing="0.1em">DOWNSTREAM</text>
  <text x="680" y="758" fill="#40565a" font-size="12" font-style="italic" font-family="'IBM Plex Sans', sans-serif" text-anchor="end">speaks only the contract, never a vendor</text>

  <rect x="40" y="772" width="300" height="76" rx="6" fill="#fffdf8" stroke="#776956" stroke-width="1"/>
  <text x="54" y="796" fill="#152529" font-size="14" font-weight="600" font-family="'IBM Plex Sans', sans-serif">station feed handler</text>
  <text x="54" y="816" fill="#40565a" font-size="12" font-family="'IBM Plex Mono', monospace">stations[] -&gt; StationFeed</text>
  <text x="54" y="834" fill="#40565a" font-size="12" font-family="'IBM Plex Mono', monospace">/feed · /current · /live · ...</text>

  <path d="M340 810 H392" fill="none" stroke="#2f454a" stroke-width="1.2" marker-end="url(#adapt-arrow)"/>
  <text x="366" y="802" fill="#40565a" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="middle">HTTP</text>

  <rect x="396" y="772" width="284" height="76" rx="6" fill="#fffdf8" stroke="#776956" stroke-width="1"/>
  <text x="410" y="796" fill="#152529" font-size="14" font-weight="600" font-family="'IBM Plex Sans', sans-serif">components + clients</text>
  <text x="410" y="818" fill="#2f454a" font-size="13" font-family="'IBM Plex Sans', sans-serif">one decoder for every station</text>

  <!-- ===== degradation belt footer ===== -->
  <rect x="24" y="880" width="672" height="72" rx="6" fill="#f2f4f1"/>
  <text x="40" y="900" fill="#40565a" font-size="12" font-weight="700" font-family="'IBM Plex Mono', monospace" letter-spacing="0.1em">THE DEGRADATION BELT</text>
  <text x="40" y="920" fill="#2f454a" font-size="13" font-family="'IBM Plex Sans', sans-serif">A throw or an invalid return degrades that station to status "unavailable"</text>
  <text x="40" y="938" fill="#2f454a" font-size="13" font-family="'IBM Plex Sans', sans-serif">with a machine reason code — still the contract — and the rest of the feed survives.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 640">
  <defs>
    <marker id="adapt-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2f454a"/>
    </marker>
  </defs>

  <!-- ground -->
  <rect x="0" y="0" width="1060" height="640" fill="#fffdf8"/>

  <!-- column headers -->
  <text x="24" y="40" fill="#40565a" font-size="9" font-weight="700" font-family="'IBM Plex Mono', monospace" letter-spacing="0.1em">VENDOR UPSTREAMS</text>
  <text x="24" y="56" fill="#40565a" font-size="10" font-style="italic" font-family="'IBM Plex Sans', sans-serif">each its own shape + units</text>
  <text x="188" y="40" fill="#40565a" font-size="9" font-weight="700" font-family="'IBM Plex Mono', monospace" letter-spacing="0.1em">PER-VENDOR ADAPTERS</text>
  <text x="188" y="56" fill="#40565a" font-size="10" font-style="italic" font-family="'IBM Plex Sans', sans-serif">meta: identity + capabilities, from config alone</text>
  <text x="188" y="70" fill="#40565a" font-size="10" font-style="italic" font-family="'IBM Plex Sans', sans-serif">load: fetch -&gt; validate -&gt; normalize</text>

  <!-- fan-in connectors (drawn before boxes) -->
  <path d="M424 126 H492 Q500 126 500 134 V234 Q500 242 508 242 H519" fill="none" stroke="#2f454a" stroke-width="1.2" marker-end="url(#adapt-arrow)"/>
  <path d="M424 218 H468 Q476 218 476 226 V268 Q476 276 484 276 H519" fill="none" stroke="#2f454a" stroke-width="1.2" marker-end="url(#adapt-arrow)"/>
  <path d="M424 310 H519" fill="none" stroke="#2f454a" stroke-width="1.2" marker-end="url(#adapt-arrow)"/>
  <path d="M424 402 H468 Q476 402 476 394 V352 Q476 344 484 344 H519" fill="none" stroke="#2f454a" stroke-width="1.2" marker-end="url(#adapt-arrow)"/>
  <path d="M424 494 H492 Q500 494 500 486 V386 Q500 378 508 378 H519" fill="none" stroke="#2f454a" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#adapt-arrow)"/>

  <!-- downstream connectors -->
  <path d="M760 278 H807" fill="none" stroke="#2f454a" stroke-width="1.2" marker-end="url(#adapt-arrow)"/>
  <path d="M916 312 V343" fill="none" stroke="#2f454a" stroke-width="1.2" marker-end="url(#adapt-arrow)"/>

  <!-- fan label on the straight middle connector -->
  <rect x="428" y="290" width="88" height="12" rx="2" fill="#fffdf8"/>
  <text x="472" y="300" fill="#40565a" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.02em">normalized Station</text>

  <!-- ===== lane 1: WindNerd (y 88..164) ===== -->
  <rect x="24" y="88" width="400" height="76" rx="6" fill="#fffdf8" stroke="#776956" stroke-width="1"/>
  <rect x="25" y="89" width="151" height="74" rx="5" fill="#f2f4f1"/>
  <line x1="176" y1="89" x2="176" y2="163" stroke="rgba(119,105,86,0.4)" stroke-width="0.8"/>
  <text x="32" y="110" fill="#152529" font-size="11" font-weight="600" font-family="'IBM Plex Sans', sans-serif">WindNerd</text>
  <text x="32" y="126" fill="#40565a" font-size="9" font-family="'IBM Plex Mono', monospace">records API + live</text>
  <rect x="32" y="136" width="32" height="16" rx="2" fill="#fffdf8" stroke="rgba(119,105,86,0.7)" stroke-width="0.8"/>
  <text x="48" y="147" fill="#2f454a" font-size="8.5" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">m/s</text>
  <text x="188" y="112" fill="#152529" font-size="10" font-weight="600" font-family="'IBM Plex Mono', monospace">vendor: "windnerd"</text>
  <text x="188" y="132" fill="#2f454a" font-size="9.5" font-family="'IBM Plex Sans', sans-serif">validates speeds 0-140 m/s</text>
  <text x="188" y="148" fill="#2f454a" font-size="9.5" font-family="'IBM Plex Sans', sans-serif">live INIT enriches meta — config wins</text>

  <!-- ===== lane 2: Tempest (y 180..256) ===== -->
  <rect x="24" y="180" width="400" height="76" rx="6" fill="#fffdf8" stroke="#776956" stroke-width="1"/>
  <rect x="25" y="181" width="151" height="74" rx="5" fill="#f2f4f1"/>
  <line x1="176" y1="181" x2="176" y2="255" stroke="rgba(119,105,86,0.4)" stroke-width="0.8"/>
  <text x="32" y="202" fill="#152529" font-size="11" font-weight="600" font-family="'IBM Plex Sans', sans-serif">Tempest</text>
  <text x="32" y="218" fill="#40565a" font-size="9" font-family="'IBM Plex Mono', monospace">swd.weatherflow.com</text>
  <rect x="32" y="228" width="32" height="16" rx="2" fill="#fffdf8" stroke="rgba(119,105,86,0.7)" stroke-width="0.8"/>
  <text x="48" y="239" fill="#2f454a" font-size="8.5" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">m/s</text>
  <text x="188" y="204" fill="#152529" font-size="10" font-weight="600" font-family="'IBM Plex Mono', monospace">vendor: "tempest"</text>
  <text x="188" y="224" fill="#2f454a" font-size="9.5" font-family="'IBM Plex Sans', sans-serif">validates speeds 0-140 m/s</text>
  <text x="188" y="240" fill="#2f454a" font-size="9.5" font-family="'IBM Plex Sans', sans-serif">fills every field of conditions</text>

  <!-- ===== lane 3: Campbell (y 272..348) ===== -->
  <rect x="24" y="272" width="400" height="76" rx="6" fill="#fffdf8" stroke="#776956" stroke-width="1"/>
  <rect x="25" y="273" width="151" height="74" rx="5" fill="#f2f4f1"/>
  <line x1="176" y1="273" x2="176" y2="347" stroke="rgba(119,105,86,0.4)" stroke-width="0.8"/>
  <text x="32" y="294" fill="#152529" font-size="11" font-weight="600" font-family="'IBM Plex Sans', sans-serif">Campbell</text>
  <text x="32" y="310" fill="#40565a" font-size="9" font-family="'IBM Plex Mono', monospace">DataQuery · no cloud</text>
  <rect x="32" y="320" width="40" height="16" rx="2" fill="#fffdf8" stroke="rgba(119,105,86,0.7)" stroke-width="0.8"/>
  <text x="52" y="331" fill="#2f454a" font-size="8.5" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">km/h</text>
  <text x="188" y="296" fill="#152529" font-size="10" font-weight="600" font-family="'IBM Plex Mono', monospace">vendor: "campbell"</text>
  <text x="188" y="316" fill="#2f454a" font-size="9.5" font-family="'IBM Plex Sans', sans-serif">bounds 0-500 km/h, then kmhToMps</text>
  <text x="188" y="332" fill="#2f454a" font-size="9.5" font-family="'IBM Plex Sans', sans-serif">pinned field contracts, units checked</text>

  <!-- ===== lane 4: Ecowitt (y 364..440) ===== -->
  <rect x="24" y="364" width="400" height="76" rx="6" fill="#fffdf8" stroke="#776956" stroke-width="1"/>
  <rect x="25" y="365" width="151" height="74" rx="5" fill="#f2f4f1"/>
  <line x1="176" y1="365" x2="176" y2="439" stroke="rgba(119,105,86,0.4)" stroke-width="0.8"/>
  <text x="32" y="386" fill="#152529" font-size="11" font-weight="600" font-family="'IBM Plex Sans', sans-serif">Ecowitt</text>
  <text x="32" y="402" fill="#40565a" font-size="9" font-family="'IBM Plex Mono', monospace">real_time · ~1/min</text>
  <rect x="32" y="412" width="64" height="16" rx="2" fill="#fffdf8" stroke="rgba(119,105,86,0.7)" stroke-width="0.8"/>
  <text x="64" y="423" fill="#2f454a" font-size="8.5" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">SI (pinned)</text>
  <text x="188" y="388" fill="#152529" font-size="10" font-weight="600" font-family="'IBM Plex Mono', monospace">vendor: "ecowitt"</text>
  <text x="188" y="408" fill="#2f454a" font-size="9.5" font-family="'IBM Plex Sans', sans-serif">request pins SI — defaults are imperial</text>
  <text x="188" y="424" fill="#2f454a" font-size="9.5" font-family="'IBM Plex Sans', sans-serif">validates speeds 0-140 m/s</text>

  <!-- ===== lane 5: Custom (y 456..532, dashed) ===== -->
  <rect x="24" y="456" width="400" height="76" rx="6" fill="rgba(21,37,41,0.02)" stroke="rgba(21,37,41,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="176" y1="457" x2="176" y2="531" stroke="rgba(119,105,86,0.4)" stroke-width="0.8"/>
  <text x="32" y="478" fill="#152529" font-size="11" font-weight="600" font-family="'IBM Plex Sans', sans-serif">Custom</text>
  <text x="32" y="494" fill="#40565a" font-size="9" font-family="'IBM Plex Mono', monospace">any upstream</text>
  <rect x="32" y="504" width="60" height="16" rx="2" fill="#fffdf8" stroke="rgba(119,105,86,0.7)" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="62" y="515" fill="#2f454a" font-size="8.5" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">your units</text>
  <text x="188" y="480" fill="#152529" font-size="10" font-weight="600" font-family="'IBM Plex Mono', monospace">vendor: "custom"</text>
  <text x="188" y="500" fill="#2f454a" font-size="9.5" font-family="'IBM Plex Sans', sans-serif">your mapping — must return a valid Station</text>
  <text x="188" y="516" fill="#2f454a" font-size="9.5" font-family="'IBM Plex Sans', sans-serif">defineStationAdapter for the full belt</text>

  <!-- ===== the contract node (focal) ===== -->
  <rect x="520" y="208" width="240" height="204" rx="8" fill="#fffdf8"/>
  <rect x="520" y="208" width="240" height="204" rx="8" fill="rgba(145,59,12,0.06)" stroke="#913b0c" stroke-width="1.4"/>
  <rect x="536" y="230" width="112" height="16" rx="2" fill="none" stroke="rgba(145,59,12,0.5)" stroke-width="0.8"/>
  <text x="592" y="241" fill="#743008" font-size="8" font-weight="700" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WIRE CONTRACT</text>
  <text x="536" y="270" fill="#152529" font-size="13" font-weight="700" font-family="'IBM Plex Mono', monospace">Station</text>
  <text x="536" y="296" fill="#2f454a" font-size="10.5" font-family="'IBM Plex Sans', sans-serif">identity + capabilities, on both arms</text>
  <text x="536" y="316" fill="#2f454a" font-size="10.5" font-family="'IBM Plex Sans', sans-serif">status "ok" -&gt; reading + history</text>
  <text x="536" y="336" fill="#2f454a" font-size="10.5" font-family="'IBM Plex Sans', sans-serif">status "unavailable" -&gt; reason code</text>
  <text x="536" y="356" fill="#2f454a" font-size="10.5" font-family="'IBM Plex Sans', sans-serif">speeds in m/s · null, never zero</text>
  <text x="536" y="376" fill="#2f454a" font-size="10.5" font-family="'IBM Plex Sans', sans-serif">capabilities declared, never inferred</text>

  <!-- callout under the contract -->
  <text x="640" y="444" fill="#2f454a" font-size="12" font-style="italic" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Whatever the hardware,</text>
  <text x="640" y="460" fill="#2f454a" font-size="12" font-style="italic" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">the client sees one document.</text>

  <!-- ===== downstream zone ===== -->
  <rect x="796" y="200" width="240" height="216" rx="8" fill="rgba(21,37,41,0.02)" stroke="rgba(119,105,86,0.45)" stroke-width="1"/>
  <text x="808" y="220" fill="#40565a" font-size="8.5" font-weight="700" font-family="'IBM Plex Mono', monospace" letter-spacing="0.1em">DOWNSTREAM</text>
  <text x="808" y="234" fill="#40565a" font-size="10" font-style="italic" font-family="'IBM Plex Sans', sans-serif">speaks only the contract, never a vendor</text>

  <rect x="808" y="244" width="216" height="68" rx="6" fill="#fffdf8" stroke="#776956" stroke-width="1"/>
  <text x="820" y="266" fill="#152529" font-size="11" font-weight="600" font-family="'IBM Plex Sans', sans-serif">station feed handler</text>
  <text x="820" y="282" fill="#40565a" font-size="9" font-family="'IBM Plex Mono', monospace">stations[] -&gt; StationFeed</text>
  <text x="820" y="296" fill="#40565a" font-size="9" font-family="'IBM Plex Mono', monospace">/feed · /current · /live · ...</text>

  <rect x="808" y="344" width="216" height="60" rx="6" fill="#fffdf8" stroke="#776956" stroke-width="1"/>
  <text x="820" y="366" fill="#152529" font-size="11" font-weight="600" font-family="'IBM Plex Sans', sans-serif">components + clients</text>
  <text x="820" y="384" fill="#2f454a" font-size="9.5" font-family="'IBM Plex Sans', sans-serif">one decoder for every station</text>

  <!-- label for handler -> clients -->
  <rect x="926" y="320" width="32" height="12" rx="2" fill="#fffdf8"/>
  <text x="942" y="330" fill="#40565a" font-size="8" font-family="'IBM Plex Mono', monospace" text-anchor="middle">HTTP</text>

  <!-- ===== degradation belt footer ===== -->
  <rect x="24" y="560" width="1012" height="52" rx="6" fill="#f2f4f1"/>
  <text x="40" y="580" fill="#40565a" font-size="8.5" font-weight="700" font-family="'IBM Plex Mono', monospace" letter-spacing="0.1em">THE DEGRADATION BELT</text>
  <text x="40" y="598" fill="#2f454a" font-size="10.5" font-family="'IBM Plex Sans', sans-serif">A throw or an invalid return degrades that station to status "unavailable" with a machine reason code — still the contract — and the rest of the feed survives.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 664">
  <defs>
    <marker id="pubflow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2f454a"/></marker>
    <marker id="pubflow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#913b0c"/></marker>
  </defs>

  <!-- plate -->
  <rect width="720" height="664" fill="#fffdf8"/>

  <!-- static-dataset boundary band between the engine and browser lanes -->
  <rect x="0" y="436" width="720" height="40" fill="rgba(145,59,12,0.06)"/>
  <line x1="0" y1="436" x2="720" y2="436" stroke="rgba(145,59,12,0.5)" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="0" y1="476" x2="720" y2="476" stroke="rgba(145,59,12,0.5)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="16" y="452" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" letter-spacing="0.12em" fill="#743008">STATIC DATASET PUBLICATION</text>
  <text x="16" y="468" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a">manifest.json · site profiles · append-only history</text>

  <!-- lane structure -->
  <line x1="0" y1="8" x2="720" y2="8" stroke="rgba(119,105,86,0.35)" stroke-width="0.8"/>
  <line x1="0" y1="112" x2="720" y2="112" stroke="rgba(119,105,86,0.35)" stroke-width="0.8"/>
  <line x1="0" y1="604" x2="720" y2="604" stroke="rgba(119,105,86,0.35)" stroke-width="0.8"/>
  <line x1="140" y1="8" x2="140" y2="436" stroke="rgba(119,105,86,0.5)" stroke-width="1"/>
  <line x1="140" y1="476" x2="140" y2="604" stroke="rgba(119,105,86,0.5)" stroke-width="1"/>
  <text x="70" y="64" font-family="'IBM Plex Mono', monospace" font-size="12" letter-spacing="0.08em" fill="#40565a" text-anchor="middle">UPSTREAM</text>
  <text x="70" y="268" font-family="'IBM Plex Mono', monospace" font-size="12" letter-spacing="0.08em" fill="#40565a" text-anchor="middle">FORECAST</text>
  <text x="70" y="284" font-family="'IBM Plex Mono', monospace" font-size="12" letter-spacing="0.08em" fill="#40565a" text-anchor="middle">ENGINE</text>
  <text x="70" y="544" font-family="'IBM Plex Mono', monospace" font-size="12" letter-spacing="0.08em" fill="#40565a" text-anchor="middle">BROWSER</text>

  <!-- arrows, before nodes -->
  <line x1="420" y1="100" x2="420" y2="120" stroke="#2f454a" stroke-width="1" marker-end="url(#pubflow-arrow)"/>
  <line x1="420" y1="204" x2="420" y2="220" stroke="#2f454a" stroke-width="1" marker-end="url(#pubflow-arrow)"/>
  <line x1="420" y1="304" x2="420" y2="320" stroke="#913b0c" stroke-width="1.2" marker-end="url(#pubflow-arrow-accent)"/>
  <line x1="600" y1="420" x2="600" y2="492" stroke="#913b0c" stroke-width="1.2" marker-end="url(#pubflow-arrow-accent)"/>

  <!-- 1 · model cycle (external) -->
  <rect x="160" y="20" width="520" height="80" rx="6" fill="#fffdf8"/>
  <rect x="160" y="20" width="520" height="80" rx="6" fill="rgba(21,37,41,0.03)" stroke="rgba(21,37,41,0.3)" stroke-width="1"/>
  <circle cx="186" cy="42" r="10" fill="rgba(21,37,41,0.12)"/>
  <text x="186" y="46.5" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" fill="#152529" text-anchor="middle">1</text>
  <text x="204" y="46.5" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" letter-spacing="0.12em" fill="#2f454a">CYCLE</text>
  <rect x="626" y="32" width="40" height="18" rx="2" fill="none" stroke="rgba(21,37,41,0.4)" stroke-width="0.8"/>
  <text x="646" y="45" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="0.08em" fill="rgba(21,37,41,0.8)" text-anchor="middle">EXT</text>
  <text x="176" y="72" font-family="'IBM Plex Sans', sans-serif" font-size="15" font-weight="600" fill="#152529">Model cycle</text>
  <text x="176" y="91" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#2f454a">ECCC or NOAA publishes a forecast cycle</text>

  <!-- 2 · completeness probe -->
  <rect x="160" y="124" width="520" height="80" rx="6" fill="#fffdf8"/>
  <rect x="160" y="124" width="520" height="80" rx="6" fill="#fffdf8" stroke="#776956" stroke-width="1"/>
  <circle cx="186" cy="146" r="10" fill="rgba(21,37,41,0.12)"/>
  <text x="186" y="150.5" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" fill="#152529" text-anchor="middle">2</text>
  <text x="204" y="150.5" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" letter-spacing="0.12em" fill="#2f454a">PROBE</text>
  <rect x="626" y="136" width="40" height="18" rx="2" fill="none" stroke="rgba(21,37,41,0.4)" stroke-width="0.8"/>
  <text x="646" y="149" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="0.08em" fill="rgba(21,37,41,0.8)" text-anchor="middle">ENG</text>
  <text x="176" y="176" font-family="'IBM Plex Sans', sans-serif" font-size="15" font-weight="600" fill="#152529">Completeness probe</text>
  <text x="176" y="195" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#2f454a">request the final required hour before fetching the run</text>

  <!-- 3 · per-model builder -->
  <rect x="160" y="224" width="520" height="80" rx="6" fill="#fffdf8"/>
  <rect x="160" y="224" width="520" height="80" rx="6" fill="#fffdf8" stroke="#776956" stroke-width="1"/>
  <circle cx="186" cy="246" r="10" fill="rgba(21,37,41,0.12)"/>
  <text x="186" y="250.5" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" fill="#152529" text-anchor="middle">3</text>
  <text x="204" y="250.5" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" letter-spacing="0.12em" fill="#2f454a">BUILD</text>
  <rect x="626" y="236" width="40" height="18" rx="2" fill="none" stroke="rgba(21,37,41,0.4)" stroke-width="0.8"/>
  <text x="646" y="249" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="0.08em" fill="rgba(21,37,41,0.8)" text-anchor="middle">ENG</text>
  <text x="176" y="276" font-family="'IBM Plex Sans', sans-serif" font-size="15" font-weight="600" fill="#152529">Per-model builder</text>
  <text x="176" y="295" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#2f454a">fetch declared records; verify, derive, serialize</text>

  <!-- 4 · publish to storage (focal) -->
  <rect x="160" y="324" width="520" height="96" rx="6" fill="#fffdf8"/>
  <rect x="160" y="324" width="520" height="96" rx="6" fill="rgba(145,59,12,0.07)" stroke="#913b0c" stroke-width="1.2"/>
  <circle cx="186" cy="346" r="10" fill="#f2dcc1" stroke="#913b0c" stroke-width="1"/>
  <text x="186" y="350.5" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" fill="#743008" text-anchor="middle">4</text>
  <text x="204" y="350.5" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" letter-spacing="0.12em" fill="#743008">PUBLISH</text>
  <rect x="626" y="336" width="40" height="18" rx="2" fill="none" stroke="rgba(145,59,12,0.5)" stroke-width="0.8"/>
  <text x="646" y="349" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="0.08em" fill="#743008" text-anchor="middle">ENG</text>
  <text x="176" y="376" font-family="'IBM Plex Sans', sans-serif" font-size="15" font-weight="600" fill="#152529">Publish to storage</text>
  <text x="176" y="395" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#2f454a">upload every completed model directory and append one</text>
  <text x="176" y="411" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#2f454a">history record per site + run</text>

  <!-- 5 · consumer read -->
  <rect x="160" y="496" width="520" height="96" rx="6" fill="#fffdf8"/>
  <rect x="160" y="496" width="520" height="96" rx="6" fill="rgba(47,69,74,0.06)" stroke="#40565a" stroke-width="1"/>
  <circle cx="186" cy="518" r="10" fill="rgba(21,37,41,0.12)"/>
  <text x="186" y="522.5" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" fill="#152529" text-anchor="middle">5</text>
  <text x="204" y="522.5" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" letter-spacing="0.12em" fill="#2f454a">READ</text>
  <rect x="626" y="508" width="40" height="18" rx="2" fill="none" stroke="rgba(21,37,41,0.4)" stroke-width="0.8"/>
  <text x="646" y="521" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="0.08em" fill="rgba(21,37,41,0.8)" text-anchor="middle">BRW</text>
  <text x="176" y="548" font-family="'IBM Plex Sans', sans-serif" font-size="15" font-weight="600" fill="#152529">Consumer read</text>
  <text x="176" y="567" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#2f454a">fetch manifest + profile; compare referenceTime;</text>
  <text x="176" y="583" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#2f454a">a torn pair reads as stale</text>

  <!-- legend -->
  <text x="16" y="630" font-family="'IBM Plex Mono', monospace" font-size="12" letter-spacing="0.14em" fill="#2f454a">LEGEND</text>
  <line x1="96" y1="626" x2="124" y2="626" stroke="#2f454a" stroke-width="1" marker-end="url(#pubflow-arrow)"/>
  <text x="134" y="630" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#2f454a">hand-off</text>
  <line x1="214" y1="626" x2="242" y2="626" stroke="#913b0c" stroke-width="1.2" marker-end="url(#pubflow-arrow-accent)"/>
  <text x="252" y="630" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#2f454a">publication path</text>
  <rect x="96" y="640" width="28" height="12" fill="rgba(145,59,12,0.06)" stroke="rgba(145,59,12,0.5)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="134" y="650" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#2f454a">static boundary — below it, file reads only; no server</text>
</svg>

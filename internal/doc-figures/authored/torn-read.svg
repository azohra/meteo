<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 930">
  <defs>
    <marker id="torn-head" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2f454a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="930" fill="#fffdf8"/>

  <text x="20" y="30" font-family="'Big Shoulders', sans-serif" font-size="20" font-weight="800" letter-spacing="0.4" fill="#152529">THE SKEW DANCE</text>
  <text x="700" y="29" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a" text-anchor="end">loadForecast: fetch, compare, retry once</text>
  <line x1="20" y1="44" x2="700" y2="44" stroke="#776956" stroke-width="1.2"/>

  <!-- one publish, two cache entries -->
  <rect x="180" y="56" width="530" height="104" fill="none" stroke="rgba(119,105,86,0.7)" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="192" y="76" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" letter-spacing="0.5" fill="#2f454a">ONE PUBLISH, TWO CACHE ENTRIES</text>
  <text x="698" y="76" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a" text-anchor="end">static storage · independent expiry</text>

  <!-- lifelines -->
  <line x1="90" y1="148" x2="90" y2="612" stroke="rgba(21,37,41,0.25)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="310" y1="148" x2="310" y2="612" stroke="rgba(21,37,41,0.25)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="572" y1="148" x2="572" y2="612" stroke="rgba(21,37,41,0.25)" stroke-width="1" stroke-dasharray="3 3"/>

  <rect x="20" y="88" width="140" height="60" fill="#fffdf8" stroke="#776956" stroke-width="1.2"/>
  <text x="90" y="113" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="700" fill="#152529" text-anchor="middle">loadForecast</text>
  <text x="90" y="134" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#40565a" text-anchor="middle">the consumer</text>

  <rect x="192" y="88" width="236" height="60" fill="#fffdf8" stroke="#776956" stroke-width="1.2"/>
  <text x="310" y="113" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#152529" text-anchor="middle">data/&lt;model&gt;/manifest.json</text>
  <text x="310" y="134" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#40565a" text-anchor="middle">cache entry</text>

  <rect x="446" y="88" width="252" height="60" fill="#fffdf8" stroke="#776956" stroke-width="1.2"/>
  <text x="572" y="113" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#152529" text-anchor="middle">data/&lt;model&gt;/sites/&lt;site&gt;.json</text>
  <text x="572" y="134" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#40565a" text-anchor="middle">cache entry</text>

  <!-- the consumer's activation -->
  <rect x="86" y="176" width="8" height="428" fill="rgba(47,69,74,0.06)" stroke="#2f454a" stroke-width="0.8"/>

  <!-- first fetch -->
  <rect x="158" y="173" width="344" height="18" fill="#fffdf8"/>
  <text x="330" y="186" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#2f454a" text-anchor="middle">fetch the pair: manifest + profile, in parallel</text>
  <path d="M94 200 H306" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#torn-head)"/>
  <path d="M94 222 H568" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#torn-head)"/>

  <!-- the two answers disagree -->
  <rect x="104" y="239" width="316" height="34" fill="#fffdf8"/>
  <text x="112" y="253" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#2f454a">referenceTime</text>
  <text x="220" y="253" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#743008">06Z</text>
  <text x="112" y="269" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#40565a">cache entry expired first: the new run is visible</text>
  <path d="M310 282 H98" stroke="#2f454a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#torn-head)"/>

  <rect x="104" y="297" width="336" height="34" fill="#fffdf8"/>
  <text x="112" y="311" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#2f454a">run.referenceTime</text>
  <text x="252" y="311" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#152529">00Z</text>
  <text x="112" y="327" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#40565a">cache entry still valid: the old run is still served</text>
  <path d="M572 340 H98" stroke="#2f454a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#torn-head)"/>

  <!-- the check -->
  <rect x="14" y="354" width="214" height="46" fill="#fffdf8" stroke="#776956" stroke-width="1.2"/>
  <text x="26" y="374" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#152529">runsConsistent(m, p)?</text>
  <text x="26" y="391" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#40565a">same model and referenceTime</text>

  <rect x="14" y="414" width="692" height="40" fill="#f2dcc1"/>
  <text x="360" y="439" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="700" fill="#743008" text-anchor="middle">06Z against 00Z: a torn pair. Rendering it as one forecast lies about both runs.</text>

  <!-- the retry -->
  <rect x="14" y="470" width="692" height="142" fill="rgba(21,37,41,0.02)" stroke="rgba(21,37,41,0.25)" stroke-width="1"/>
  <rect x="14" y="470" width="72" height="22" fill="#f2f4f1" stroke="rgba(21,37,41,0.25)" stroke-width="1"/>
  <text x="50" y="485" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.2" fill="#2f454a" text-anchor="middle">RETRY</text>
  <text x="100" y="486" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a">[runsConsistent false]</text>

  <path d="M94 510 H146 Q154 510 154 518 V522 Q154 530 146 530 H100" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#torn-head)"/>
  <text x="168" y="518" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#152529">WAIT ~1.5 s</text>
  <text x="168" y="535" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#40565a">publishes converge quickly</text>

  <text x="112" y="564" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#2f454a">refetch the pair, once</text>
  <path d="M94 576 H306" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#torn-head)"/>
  <path d="M94 598 H568" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#torn-head)"/>

  <text x="360" y="638" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a" text-anchor="middle">true -&gt; return the pair with stale: false;</text>
  <text x="360" y="655" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a" text-anchor="middle">after the refetch, stale records whether the pair still disagrees</text>

  <!-- every way it resolves -->
  <text x="20" y="696" font-family="'Big Shoulders', sans-serif" font-size="20" font-weight="800" letter-spacing="0.4" fill="#152529">EVERY WAY IT RESOLVES</text>
  <text x="700" y="695" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a" text-anchor="end">discriminate a miss with "miss" in result</text>
  <line x1="20" y1="710" x2="700" y2="710" stroke="#776956" stroke-width="1.2"/>

  <rect x="20" y="726" width="680" height="56" fill="#fffdf8" stroke="#152529" stroke-width="1.5"/>
  <text x="36" y="750" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#152529">{ manifest, profile, stale: false }</text>
  <text x="36" y="770" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#40565a">a consistent pair: render it</text>

  <rect x="20" y="794" width="680" height="56" fill="#fffdf8" stroke="#776956" stroke-width="1.2"/>
  <text x="36" y="818" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#152529">{ manifest, profile, stale: true }</text>
  <text x="36" y="838" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#40565a">freshest complete pair, still torn; note it or fall back; never mix the two</text>

  <rect x="20" y="862" width="680" height="56" fill="#fffdf8" stroke="#776956" stroke-width="1.2"/>
  <text x="36" y="886" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#152529">{ miss: "absent" | "invalid", url }</text>
  <text x="36" y="906" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#40565a">absent: routine 404 · invalid: contract break; log it loudly; other HTTP errors throw</text>
</svg>

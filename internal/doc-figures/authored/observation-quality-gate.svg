<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 392">
  <defs>
    <marker id="oqg-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2f454a"/>
    </marker>
  </defs>

  <!-- recessed product plates -->
  <rect x="112" y="8" width="420" height="276" fill="#f2f4f1"/>
  <rect x="548" y="8" width="420" height="276" fill="#f2f4f1"/>

  <!-- shared row labels (gutter) -->
  <text x="4" y="121" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="700" letter-spacing="0.5" fill="#40565a">THE UINT16 CODES</text>
  <text x="4" y="190" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="700" letter-spacing="0.5" fill="#40565a">DQF STATES</text>
  <text x="4" y="242" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="700" letter-spacing="0.5" fill="#40565a">A NIGHT PIXEL</text>
  <text x="4" y="254" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="700" letter-spacing="0.5" fill="#40565a">ARRIVES AS</text>

  <!-- ============ panel A · DSR ============ -->
  <rect x="124" y="18" width="24" height="24" fill="#152529"/>
  <text x="136" y="35" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#fffdf8" text-anchor="middle">A</text>
  <text x="158" y="36" font-family="'Big Shoulders', sans-serif" font-size="17" font-weight="800" letter-spacing="0.36" fill="#152529">DSR · DOWNWARD SHORTWAVE</text>
  <text x="124" y="60" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#40565a">ABI-L2-DSRF · W/m² · scale 0.02289028</text>
  <line x1="124" y1="72" x2="520" y2="72" stroke="#2f454a" stroke-width="1.2"/>

  <!-- A · number line -->
  <text x="314" y="98" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="700" fill="#152529" text-anchor="middle">valid_range spans 0–65535</text>
  <path d="M124 104 V110 M124 107 H504 M504 104 V110" stroke="#152529" stroke-width="1.6" fill="none"/>
  <line x1="124" y1="118" x2="504" y2="118" stroke="#2f454a" stroke-width="1.5"/>
  <circle cx="493" cy="118" r="5" fill="#152529" stroke="#fffdf8" stroke-width="1.5"/>
  <text x="124" y="136" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#2f454a">0</text>
  <text x="493" y="136" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="700" fill="#152529" text-anchor="end">_FillValue 65535</text>
  <text x="493" y="150" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="700" fill="#743008" text-anchor="end">INSIDE valid_range</text>
  <text x="124" y="150" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#40565a">0–1500 W/m²</text>

  <!-- A · DQF chips: solid = publishes, outline = rejected, dashed = non-state -->
  <rect x="124" y="176" width="48" height="20" fill="#2f454a"/>
  <text x="148" y="190" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="700" fill="#fffdf8" text-anchor="middle">0 good</text>
  <rect x="180" y="176" width="198" height="20" fill="#2f454a"/>
  <text x="279" y="190" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="700" fill="#fffdf8" text-anchor="middle">1 degraded/invalid · quality: 1</text>
  <rect x="386" y="176" width="66" height="20" fill="#fffdf8" stroke="#2f454a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="419" y="190" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="700" fill="#2f454a" text-anchor="middle">255 space</text>
  <text x="124" y="214" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="700" fill="#152529">published &lt;= 1 · degraded labelled</text>

  <!-- A · night pixel (the trap) -->
  <rect x="124" y="228" width="396" height="40" fill="#f2dcc1" stroke="#913b0c" stroke-width="1.4"/>
  <text x="134" y="245" font-family="'IBM Plex Mono', monospace" font-size="10.5" font-weight="700" fill="#152529">fill · DQF 0</text>
  <text x="134" y="261" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#743008">the trap: DQF 0 does not imply a retrieval</text>

  <!-- ============ panel B · AOD ============ -->
  <rect x="560" y="18" width="24" height="24" fill="#152529"/>
  <text x="572" y="35" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#fffdf8" text-anchor="middle">B</text>
  <text x="594" y="36" font-family="'Big Shoulders', sans-serif" font-size="17" font-weight="800" letter-spacing="0.36" fill="#152529">AOD · AEROSOL OPTICAL DEPTH</text>
  <text x="560" y="60" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#40565a">ABI-L2-AODF · at 550 nm · scale 7.706e-5, offset -0.05</text>
  <line x1="560" y1="72" x2="956" y2="72" stroke="#2f454a" stroke-width="1.2"/>

  <!-- B · number line -->
  <text x="736" y="98" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="700" fill="#152529" text-anchor="middle">valid_range [0, 65530]</text>
  <path d="M560 104 V110 M560 107 H913 M913 104 V110" stroke="#152529" stroke-width="1.6" fill="none"/>
  <line x1="560" y1="118" x2="940" y2="118" stroke="#2f454a" stroke-width="1.5"/>
  <circle cx="929" cy="118" r="5" fill="#152529" stroke="#fffdf8" stroke-width="1.5"/>
  <text x="560" y="136" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#2f454a">0</text>
  <text x="929" y="136" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="700" fill="#152529" text-anchor="end">_FillValue 65535</text>
  <text x="929" y="150" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="700" fill="#2f454a" text-anchor="end">OUTSIDE valid_range</text>
  <text x="560" y="150" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#40565a">-0.05 to +5.0</text>

  <!-- B · DQF chips -->
  <rect x="560" y="176" width="48" height="20" fill="#2f454a"/>
  <text x="584" y="190" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="700" fill="#fffdf8" text-anchor="middle">0 high</text>
  <rect x="616" y="176" width="138" height="20" fill="#2f454a"/>
  <text x="685" y="190" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="700" fill="#fffdf8" text-anchor="middle">1 medium · quality: 1</text>
  <rect x="762" y="176" width="42" height="20" fill="#fffdf8" stroke="#2f454a" stroke-width="1.2"/>
  <text x="783" y="190" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="700" fill="#2f454a" text-anchor="middle">2 low</text>
  <rect x="812" y="176" width="96" height="20" fill="#fffdf8" stroke="#2f454a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="860" y="190" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="700" fill="#2f454a" text-anchor="middle">3 no retrieval</text>
  <text x="560" y="214" font-family="'IBM Plex Mono', monospace" font-size="9.5" font-weight="700" fill="#152529">published &lt;= 1 · medium labelled</text>

  <!-- B · night pixel (clean flag) -->
  <rect x="560" y="228" width="396" height="40" fill="#fffdf8" stroke="#2f454a" stroke-width="1.4"/>
  <text x="570" y="245" font-family="'IBM Plex Mono', monospace" font-size="10.5" font-weight="700" fill="#152529">fill · DQF 3</text>
  <text x="570" y="261" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#40565a">the explicit no-retrieval flag DSR's night-fill-with-DQF-0 lacks</text>

  <!-- both products feed the one gate -->
  <line x1="322" y1="284" x2="322" y2="298" stroke="#2f454a" stroke-width="1.2" marker-end="url(#oqg-arrow)"/>
  <line x1="758" y1="284" x2="758" y2="298" stroke="#2f454a" stroke-width="1.2" marker-end="url(#oqg-arrow)"/>

  <!-- the shared gate band -->
  <rect x="6" y="304" width="968" height="80" fill="#f2f4f1" stroke="#913b0c" stroke-width="1.8"/>
  <text x="490" y="332" font-family="'Big Shoulders', sans-serif" font-size="19" font-weight="800" letter-spacing="0.4" fill="#152529" text-anchor="middle">ONE GATE, BOTH PRODUCTS: UNMASKED AND QUALITY</text>
  <text x="490" y="354" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#2f454a" text-anchor="middle">the builder applies the shared gate even where AOD's fill separates cleanly: one code path can only reject more</text>
  <text x="490" y="372" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#40565a" text-anchor="middle">a nonzero accepted DQF publishes as the entry's quality label; anything that fails publishes as absence: never zero, never a guess</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720">
  <defs>
    <marker id="oqg-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2f454a"/>
    </marker>
  </defs>

  <!-- recessed product plates, stacked -->
  <rect x="10" y="4" width="670" height="276" fill="#f2f4f1"/>
  <rect x="10" y="294" width="670" height="276" fill="#f2f4f1"/>

  <!-- ============ panel A · DSR ============ -->
  <rect x="20" y="12" width="24" height="24" fill="#152529"/>
  <text x="32" y="29" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="700" fill="#fffdf8" text-anchor="middle">A</text>
  <text x="54" y="31" font-family="'Big Shoulders', sans-serif" font-size="19" font-weight="800" letter-spacing="0.38" fill="#152529">DSR · DOWNWARD SHORTWAVE</text>
  <text x="20" y="56" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a">ABI-L2-DSRF · W/m² · scale 0.02289028</text>
  <line x1="20" y1="66" x2="670" y2="66" stroke="#2f454a" stroke-width="1.2"/>

  <!-- row labels -->
  <text x="20" y="112" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.5" fill="#40565a">THE UINT16 CODES</text>
  <text x="20" y="181" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.5" fill="#40565a">DQF STATES</text>
  <text x="20" y="241" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.5" fill="#40565a">A NIGHT PIXEL</text>
  <text x="20" y="256" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.5" fill="#40565a">ARRIVES AS</text>

  <!-- A · number line -->
  <text x="415" y="88" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" fill="#152529" text-anchor="middle">valid_range spans 0–65535</text>
  <path d="M170 94 V100 M170 97 H660 M660 94 V100" stroke="#152529" stroke-width="1.6" fill="none"/>
  <line x1="170" y1="108" x2="660" y2="108" stroke="#2f454a" stroke-width="1.5"/>
  <circle cx="648" cy="108" r="5" fill="#152529" stroke="#fffdf8" stroke-width="1.5"/>
  <text x="170" y="127" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#2f454a">0</text>
  <text x="648" y="127" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" fill="#152529" text-anchor="end">_FillValue 65535</text>
  <text x="648" y="144" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" fill="#743008" text-anchor="end">INSIDE valid_range</text>
  <text x="170" y="144" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a">0–1500 W/m²</text>

  <!-- A · DQF chips: solid = publishes, outline = rejected, dashed = non-state -->
  <rect x="170" y="164" width="58" height="24" fill="#2f454a"/>
  <text x="199" y="181" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" fill="#fffdf8" text-anchor="middle">0 good</text>
  <rect x="236" y="164" width="238" height="24" fill="#2f454a"/>
  <text x="355" y="181" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" fill="#fffdf8" text-anchor="middle">1 degraded/invalid · quality: 1</text>
  <rect x="482" y="164" width="80" height="24" fill="#fffdf8" stroke="#2f454a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="522" y="181" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" fill="#2f454a" text-anchor="middle">255 space</text>
  <text x="170" y="208" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" fill="#152529">published &lt;= 1 · degraded labelled</text>

  <!-- A · night pixel (the trap) -->
  <rect x="170" y="222" width="490" height="46" fill="#f2dcc1" stroke="#913b0c" stroke-width="1.4"/>
  <text x="182" y="241" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#152529">fill · DQF 0</text>
  <text x="182" y="259" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#743008">the trap: DQF 0 does not imply a retrieval</text>

  <!-- ============ panel B · AOD ============ -->
  <rect x="20" y="302" width="24" height="24" fill="#152529"/>
  <text x="32" y="319" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="700" fill="#fffdf8" text-anchor="middle">B</text>
  <text x="54" y="321" font-family="'Big Shoulders', sans-serif" font-size="19" font-weight="800" letter-spacing="0.38" fill="#152529">AOD · AEROSOL OPTICAL DEPTH</text>
  <text x="20" y="346" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a">ABI-L2-AODF · at 550 nm · scale 7.706e-5, offset -0.05</text>
  <line x1="20" y1="356" x2="670" y2="356" stroke="#2f454a" stroke-width="1.2"/>

  <!-- row labels -->
  <text x="20" y="402" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.5" fill="#40565a">THE UINT16 CODES</text>
  <text x="20" y="471" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.5" fill="#40565a">DQF STATES</text>
  <text x="20" y="531" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.5" fill="#40565a">A NIGHT PIXEL</text>
  <text x="20" y="546" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.5" fill="#40565a">ARRIVES AS</text>

  <!-- B · number line -->
  <text x="397" y="378" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" fill="#152529" text-anchor="middle">valid_range [0, 65530]</text>
  <path d="M170 384 V390 M170 387 H625 M625 384 V390" stroke="#152529" stroke-width="1.6" fill="none"/>
  <line x1="170" y1="398" x2="660" y2="398" stroke="#2f454a" stroke-width="1.5"/>
  <circle cx="646" cy="398" r="5" fill="#152529" stroke="#fffdf8" stroke-width="1.5"/>
  <text x="170" y="417" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#2f454a">0</text>
  <text x="646" y="417" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" fill="#152529" text-anchor="end">_FillValue 65535</text>
  <text x="646" y="434" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" fill="#2f454a" text-anchor="end">OUTSIDE valid_range</text>
  <text x="170" y="434" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a">-0.05 to +5.0</text>

  <!-- B · DQF chips -->
  <rect x="170" y="454" width="58" height="24" fill="#2f454a"/>
  <text x="199" y="471" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" fill="#fffdf8" text-anchor="middle">0 high</text>
  <rect x="236" y="454" width="166" height="24" fill="#2f454a"/>
  <text x="319" y="471" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" fill="#fffdf8" text-anchor="middle">1 medium · quality: 1</text>
  <rect x="410" y="454" width="52" height="24" fill="#fffdf8" stroke="#2f454a" stroke-width="1.2"/>
  <text x="436" y="471" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" fill="#2f454a" text-anchor="middle">2 low</text>
  <rect x="470" y="454" width="116" height="24" fill="#fffdf8" stroke="#2f454a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="528" y="471" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" fill="#2f454a" text-anchor="middle">3 no retrieval</text>
  <text x="170" y="498" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" fill="#152529">published &lt;= 1 · medium labelled</text>

  <!-- B · night pixel (clean flag) -->
  <rect x="170" y="512" width="490" height="46" fill="#fffdf8" stroke="#2f454a" stroke-width="1.4"/>
  <text x="182" y="531" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#152529">fill · DQF 3</text>
  <text x="182" y="549" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a">the explicit no-retrieval flag DSR's night-fill-with-DQF-0 lacks</text>

  <!-- both products feed the one gate -->
  <path d="M680 140 H700 M680 430 H700 M700 140 V584" stroke="#2f454a" stroke-width="1.2" fill="none"/>
  <line x1="700" y1="570" x2="700" y2="586" stroke="#2f454a" stroke-width="1.2" marker-end="url(#oqg-arrow)"/>

  <!-- the shared gate band -->
  <rect x="10" y="590" width="700" height="122" fill="#f2f4f1" stroke="#913b0c" stroke-width="1.8"/>
  <text x="360" y="620" font-family="'Big Shoulders', sans-serif" font-size="19" font-weight="800" letter-spacing="0.4" fill="#152529" text-anchor="middle">ONE GATE, BOTH PRODUCTS: UNMASKED AND QUALITY</text>
  <text x="360" y="644" font-family="'IBM Plex Sans', sans-serif" font-size="12.5" fill="#2f454a" text-anchor="middle">the builder applies the shared gate even where AOD's fill separates cleanly:</text>
  <text x="360" y="661" font-family="'IBM Plex Sans', sans-serif" font-size="12.5" fill="#2f454a" text-anchor="middle">one code path can only reject more</text>
  <text x="360" y="684" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a" text-anchor="middle">a nonzero accepted DQF publishes as the entry's quality label;</text>
  <text x="360" y="700" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a" text-anchor="middle">anything that fails publishes as absence: never zero, never a guess</text>
</svg>

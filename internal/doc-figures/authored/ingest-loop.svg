<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 696">
  <defs>
    <marker id="ingest-head" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2f454a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="696" fill="#fffdf8"/>
  <!-- arrows first; boxes paint over their ends -->
  <path d="M360 92 V126" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#ingest-head)"/>
  <path d="M360 206 V248" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#ingest-head)"/>
  <text x="372" y="232" fill="#2f454a" font-family="'IBM Plex Mono', monospace" font-size="12">pair changed</text>
  <path d="M500 168 H692 A8 8 0 0 1 700 176 V552" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#ingest-head)"/>
  <text x="508" y="145" fill="#2f454a" font-family="'IBM Plex Mono', monospace" font-size="12">unchanged pair;</text>
  <text x="508" y="160" fill="#2f454a" font-family="'IBM Plex Mono', monospace" font-size="12">nothing new this tick</text>
  <path d="M500 290 H590 A8 8 0 0 1 598 298 V388" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#ingest-head)"/>
  <text x="508" y="268" fill="#2f454a" font-family="'IBM Plex Mono', monospace" font-size="12">still mixed</text>
  <text x="508" y="283" fill="#2f454a" font-family="'IBM Plex Mono', monospace" font-size="12">after one retry</text>
  <path d="M360 328 V388" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#ingest-head)"/>
  <text x="372" y="352" fill="#2f454a" font-family="'IBM Plex Mono', monospace" font-size="12">syncing: false;</text>
  <text x="372" y="368" fill="#2f454a" font-family="'IBM Plex Mono', monospace" font-size="12">one run anchors the whole set</text>
  <path d="M360 468 V552" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#ingest-head)"/>
  <text x="350" y="496" fill="#2f454a" font-family="'IBM Plex Mono', monospace" font-size="12" text-anchor="end">the new run becomes</text>
  <text x="350" y="512" fill="#2f454a" font-family="'IBM Plex Mono', monospace" font-size="12" text-anchor="end">what you serve</text>
  <path d="M598 468 V552" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#ingest-head)"/>
  <text x="588" y="492" fill="#2f454a" font-family="'IBM Plex Mono', monospace" font-size="12" text-anchor="end">ingest nothing;</text>
  <text x="588" y="508" fill="#2f454a" font-family="'IBM Plex Mono', monospace" font-size="12" text-anchor="end">the store keeps serving</text>
  <text x="588" y="524" fill="#2f454a" font-family="'IBM Plex Mono', monospace" font-size="12" text-anchor="end">what it already holds</text>
  <path d="M28 556 V54 A8 8 0 0 1 36 46 H216" stroke="#2f454a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ingest-head)"/>
  <text x="40" y="164" fill="#40565a" font-family="'IBM Plex Mono', monospace" font-size="12">next tick; your cadence,</text>
  <text x="40" y="180" fill="#40565a" font-family="'IBM Plex Mono', monospace" font-size="12">a small fraction of the</text>
  <text x="40" y="196" fill="#40565a" font-family="'IBM Plex Mono', monospace" font-size="12">fastest runIntervalHours</text>
  <text x="40" y="212" fill="#40565a" font-family="'IBM Plex Mono', monospace" font-size="12">you serve</text>
  <rect x="220" y="16" width="280" height="76" fill="#fffdf8" stroke="#2f454a" stroke-width="1.2"/>
  <circle cx="220" cy="16" r="11" fill="#152529" stroke="#fffdf8" stroke-width="1.5"/>
  <text x="220" y="20.5" fill="#fffdf8" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">1</text>
  <text x="360.0" y="44" fill="#152529" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">POLL runs.json</text>
  <text x="360.0" y="64" fill="#40565a" font-family="'IBM Plex Sans', sans-serif" font-size="12.5" text-anchor="middle">loadRuns: one small fetch;</text>
  <text x="360.0" y="80" fill="#40565a" font-family="'IBM Plex Sans', sans-serif" font-size="12.5" text-anchor="middle">the poll is the subscription</text>
  <rect x="220" y="130" width="280" height="76" fill="#fffdf8" stroke="#2f454a" stroke-width="1.2"/>
  <circle cx="220" cy="130" r="11" fill="#152529" stroke="#fffdf8" stroke-width="1.5"/>
  <text x="220" y="134.5" fill="#fffdf8" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">2</text>
  <text x="360.0" y="158" fill="#152529" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">(referenceTime, generatedAt)</text>
  <text x="360.0" y="178" fill="#40565a" font-family="'IBM Plex Sans', sans-serif" font-size="12.5" text-anchor="middle">the identity pair, compared</text>
  <text x="360.0" y="194" fill="#40565a" font-family="'IBM Plex Sans', sans-serif" font-size="12.5" text-anchor="middle">against seen[slug] per model</text>
  <rect x="220" y="252" width="280" height="76" fill="#fffdf8" stroke="#2f454a" stroke-width="1.2"/>
  <circle cx="220" cy="252" r="11" fill="#152529" stroke="#fffdf8" stroke-width="1.5"/>
  <text x="220" y="256.5" fill="#fffdf8" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">3</text>
  <text x="360.0" y="280" fill="#152529" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">loadSiteSet</text>
  <text x="360.0" y="300" fill="#40565a" font-family="'IBM Plex Sans', sans-serif" font-size="12.5" text-anchor="middle">the manifest is the commit point;</text>
  <text x="360.0" y="316" fill="#40565a" font-family="'IBM Plex Sans', sans-serif" font-size="12.5" text-anchor="middle">misses never poison the set</text>
  <rect x="516" y="392" width="164" height="76" fill="#fffdf8" stroke="#2f454a" stroke-width="1.2"/>
  <circle cx="516" cy="392" r="11" fill="#152529" stroke="#fffdf8" stroke-width="1.5"/>
  <text x="516" y="396.5" fill="#fffdf8" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">4</text>
  <text x="598.0" y="420" fill="#152529" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">syncing: true</text>
  <text x="598.0" y="440" fill="#40565a" font-family="'IBM Plex Sans', sans-serif" font-size="12.5" text-anchor="middle">a publish mid-flight;</text>
  <text x="598.0" y="456" fill="#40565a" font-family="'IBM Plex Sans', sans-serif" font-size="12.5" text-anchor="middle">runsSeen names the runs</text>
  <rect x="220" y="392" width="280" height="76" fill="#fffdf8" stroke="#2f454a" stroke-width="1.2"/>
  <circle cx="220" cy="392" r="11" fill="#152529" stroke="#fffdf8" stroke-width="1.5"/>
  <text x="220" y="396.5" fill="#fffdf8" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">5</text>
  <text x="360.0" y="420" fill="#152529" font-family="'Big Shoulders', sans-serif" font-size="16" font-weight="800" letter-spacing="0.4" text-anchor="middle">ATOMIC SWAP</text>
  <text x="360.0" y="440" fill="#40565a" font-family="'IBM Plex Sans', sans-serif" font-size="12.5" text-anchor="middle">store the set under its new</text>
  <text x="360.0" y="456" fill="#40565a" font-family="'IBM Plex Sans', sans-serif" font-size="12.5" text-anchor="middle">referenceTime · advance seen[slug]</text>
  <rect x="16" y="556" width="688" height="126" fill="#f2f4f1" stroke="#913b0c" stroke-width="1.8"/>
  <text x="360" y="588" fill="#152529" font-family="'Big Shoulders', sans-serif" font-size="19" font-weight="800" letter-spacing="0.4" text-anchor="middle">SERVING: THE NEWEST COHERENT PUBLICATION THE STORE HOLDS</text>
  <text x="360" y="612" fill="#2f454a" font-family="'IBM Plex Sans', sans-serif" font-size="12.5" text-anchor="middle">the standing state, not a step: the predecessor keeps serving</text>
  <text x="360" y="629" fill="#2f454a" font-family="'IBM Plex Sans', sans-serif" font-size="12.5" text-anchor="middle">through syncing sets, late runs, and dead ticks</text>
  <text x="360" y="652" fill="#40565a" font-family="'IBM Plex Mono', monospace" font-size="12" text-anchor="middle">never a partially ingested run</text>
  <text x="360" y="669" fill="#40565a" font-family="'IBM Plex Mono', monospace" font-size="12" text-anchor="middle">never delete on a miss: "this is the 06Z run; the 12Z is late"</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 566">
  <defs>
    <marker id="ingest-head" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2f454a"/>
    </marker>
  </defs>

  <path d="M390 80 V112" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#ingest-head)"/>

  <path d="M390 184 V224" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#ingest-head)"/>
  <text x="402" y="208" fill="#2f454a" font-family="'IBM Plex Mono', monospace" font-size="10">pair changed</text>

  <path d="M540 150 H928 A8 8 0 0 1 936 158 V478" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#ingest-head)"/>
  <text x="738" y="138" fill="#2f454a" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">unchanged pair; nothing new this tick</text>

  <path d="M540 262 H716 A8 8 0 0 1 724 270 V332" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#ingest-head)"/>
  <text x="630" y="252" fill="#2f454a" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">still mixed after one retry</text>

  <path d="M390 296 V352" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#ingest-head)"/>
  <text x="402" y="318" fill="#2f454a" font-family="'IBM Plex Mono', monospace" font-size="10">syncing: false;</text>
  <text x="402" y="334" fill="#2f454a" font-family="'IBM Plex Mono', monospace" font-size="10">one run anchors the whole set</text>

  <path d="M390 424 V478" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#ingest-head)"/>
  <text x="402" y="452" fill="#2f454a" font-family="'IBM Plex Mono', monospace" font-size="10">the new run becomes what you serve</text>

  <path d="M724 404 V478" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#ingest-head)"/>
  <text x="734" y="430" fill="#2f454a" font-family="'IBM Plex Mono', monospace" font-size="10">ingest nothing; the store keeps</text>
  <text x="734" y="444" fill="#2f454a" font-family="'IBM Plex Mono', monospace" font-size="10">serving what it already holds</text>

  <path d="M64 482 V54 A8 8 0 0 1 72 46 H232" stroke="#2f454a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ingest-head)"/>
  <text x="76" y="250" fill="#40565a" font-family="'IBM Plex Mono', monospace" font-size="10">next tick; your cadence,</text>
  <text x="76" y="266" fill="#40565a" font-family="'IBM Plex Mono', monospace" font-size="10">a small fraction of the</text>
  <text x="76" y="282" fill="#40565a" font-family="'IBM Plex Mono', monospace" font-size="10">fastest runIntervalHours</text>
  <text x="76" y="298" fill="#40565a" font-family="'IBM Plex Mono', monospace" font-size="10">you serve</text>

  <rect x="240" y="12" width="300" height="68" fill="#fffdf8" stroke="#2f454a" stroke-width="1.2"/>
  <circle cx="240" cy="12" r="9" fill="#152529" stroke="#fffdf8" stroke-width="1.5"/>
  <text x="240" y="15.5" fill="#fffdf8" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">1</text>
  <text x="390" y="38" fill="#152529" font-family="'IBM Plex Mono', monospace" font-size="12.5" font-weight="700" text-anchor="middle">POLL runs.json</text>
  <text x="390" y="56" fill="#40565a" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" text-anchor="middle">loadRuns: one small fetch;</text>
  <text x="390" y="70" fill="#40565a" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" text-anchor="middle">the poll is the subscription</text>

  <rect x="240" y="116" width="300" height="68" fill="#fffdf8" stroke="#2f454a" stroke-width="1.2"/>
  <circle cx="240" cy="116" r="9" fill="#152529" stroke="#fffdf8" stroke-width="1.5"/>
  <text x="240" y="119.5" fill="#fffdf8" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">2</text>
  <text x="390" y="142" fill="#152529" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">(referenceTime, generatedAt)</text>
  <text x="390" y="160" fill="#40565a" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" text-anchor="middle">the identity pair, compared</text>
  <text x="390" y="174" fill="#40565a" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" text-anchor="middle">against seen[slug] per model</text>

  <rect x="240" y="228" width="300" height="68" fill="#fffdf8" stroke="#2f454a" stroke-width="1.2"/>
  <circle cx="240" cy="228" r="9" fill="#152529" stroke="#fffdf8" stroke-width="1.5"/>
  <text x="240" y="231.5" fill="#fffdf8" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">3</text>
  <text x="390" y="254" fill="#152529" font-family="'IBM Plex Mono', monospace" font-size="12.5" font-weight="700" text-anchor="middle">loadSiteSet</text>
  <text x="390" y="272" fill="#40565a" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" text-anchor="middle">the manifest is the commit point;</text>
  <text x="390" y="286" fill="#40565a" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" text-anchor="middle">misses never poison the set</text>

  <rect x="600" y="336" width="248" height="68" fill="#fffdf8" stroke="#2f454a" stroke-width="1.2"/>
  <circle cx="600" cy="336" r="9" fill="#152529" stroke="#fffdf8" stroke-width="1.5"/>
  <text x="600" y="339.5" fill="#fffdf8" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">4</text>
  <text x="724" y="362" fill="#152529" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">syncing: true</text>
  <text x="724" y="380" fill="#40565a" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" text-anchor="middle">a publish mid-flight;</text>
  <text x="724" y="394" fill="#40565a" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" text-anchor="middle">runsSeen names the runs</text>

  <rect x="240" y="356" width="300" height="68" fill="#fffdf8" stroke="#2f454a" stroke-width="1.2"/>
  <circle cx="240" cy="356" r="9" fill="#152529" stroke="#fffdf8" stroke-width="1.5"/>
  <text x="240" y="359.5" fill="#fffdf8" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">5</text>
  <text x="390" y="382" fill="#152529" font-family="'Big Shoulders', sans-serif" font-size="15" font-weight="800" letter-spacing="0.4" text-anchor="middle">ATOMIC SWAP</text>
  <text x="390" y="400" fill="#40565a" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" text-anchor="middle">store the set under its new</text>
  <text x="390" y="414" fill="#40565a" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" text-anchor="middle">referenceTime · advance seen[slug]</text>

  <rect x="32" y="482" width="916" height="84" fill="#f2f4f1" stroke="#913b0c" stroke-width="1.8"/>
  <text x="490" y="512" fill="#152529" font-family="'Big Shoulders', sans-serif" font-size="19" font-weight="800" letter-spacing="0.4" text-anchor="middle">SERVING: THE NEWEST COHERENT PUBLICATION THE STORE HOLDS</text>
  <text x="490" y="533" fill="#2f454a" font-family="'IBM Plex Sans', sans-serif" font-size="11" text-anchor="middle">the standing state, not a step: the predecessor keeps serving through syncing sets, late runs, and dead ticks</text>
  <text x="490" y="551" fill="#40565a" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">never a partially ingested run · never delete on a miss: "this is the 06Z run; the 12Z is late"</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 784">
  <defs>
    <marker id="roll-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2f454a"/>
    </marker>
    <marker id="roll-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#913b0c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="784" fill="#fffdf8"/>

  <!-- dataset lane recessed panel: the middle column, top to bottom -->
  <rect x="244" y="8" width="196" height="768" rx="8" fill="#f2f4f1"/>

  <!-- lane headers: writer, published dataset, readers -->
  <text x="102" y="26" fill="#152529" font-size="12" font-weight="700" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.1em">WRITER</text>
  <text x="102" y="44" fill="#40565a" font-size="12" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">an operator pins</text>
  <text x="102" y="60" fill="#2f454a" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="middle">@azohra/meteo.forecast</text>
  <text x="102" y="78" fill="#40565a" font-size="12" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">it embeds its own briefing</text>
  <text x="102" y="94" fill="#40565a" font-size="12" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">as the writer</text>

  <text x="342" y="26" fill="#152529" font-size="12" font-weight="700" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.1em">PUBLISHED DATASET</text>
  <text x="342" y="44" fill="#40565a" font-size="12" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">the documents</text>
  <text x="342" y="60" fill="#40565a" font-size="12" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">between them</text>

  <text x="600" y="26" fill="#152529" font-size="12" font-weight="700" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.1em">READERS</text>
  <text x="600" y="44" fill="#40565a" font-size="12" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">consumers pinning</text>
  <text x="600" y="60" fill="#2f454a" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="middle">@azohra/meteo.briefing</text>

  <line x1="12" y1="106" x2="708" y2="106" stroke="#776956" stroke-opacity="0.35" stroke-width="0.8"/>

  <!-- phase separators; the second stops at the dataset box that spans both phases -->
  <line x1="12" y1="254" x2="708" y2="254" stroke="#776956" stroke-opacity="0.3" stroke-width="0.8" stroke-dasharray="2,4"/>
  <line x1="12" y1="448" x2="236" y2="448" stroke="#776956" stroke-opacity="0.3" stroke-width="0.8" stroke-dasharray="2,4"/>
  <line x1="448" y1="448" x2="708" y2="448" stroke="#776956" stroke-opacity="0.3" stroke-width="0.8" stroke-dasharray="2,4"/>

  <!-- phase 0: before the bump -->
  <text x="12" y="128" fill="#40565a" font-size="12" font-weight="600" font-family="'IBM Plex Mono', monospace" letter-spacing="0.04em">BEFORE THE BUMP</text>

  <rect x="12" y="140" width="172" height="84" rx="6" fill="#fffdf8" stroke="#776956" stroke-width="1"/>
  <text x="98" y="164" fill="#152529" font-size="14" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">writer emits v1</text>
  <text x="98" y="186" fill="#2f454a" font-size="12" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">a writer emits only</text>
  <text x="98" y="202" fill="#2f454a" font-size="12" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">the newest</text>

  <rect x="252" y="140" width="180" height="84" rx="6" fill="rgba(21,37,41,0.05)" stroke="#40565a" stroke-width="1"/>
  <text x="342" y="174" fill="#152529" font-size="14" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">v1 documents</text>
  <text x="342" y="196" fill="#2f454a" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="middle">schemaVersion: 1</text>

  <rect x="492" y="140" width="216" height="100" rx="6" fill="rgba(47,69,74,0.06)" stroke="#40565a" stroke-width="1"/>
  <text x="600" y="164" fill="#152529" font-size="14" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">reader parses v1</text>
  <text x="600" y="186" fill="#2f454a" font-size="12" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">a guard parses every version</text>
  <text x="600" y="202" fill="#2f454a" font-size="12" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">ever published,</text>
  <text x="600" y="218" fill="#2f454a" font-size="12" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">normalized up</text>

  <text x="218" y="176" fill="#40565a" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">PUBLISHES</text>
  <line x1="184" y1="184" x2="249" y2="184" stroke="#2f454a" stroke-width="1" marker-end="url(#roll-arrow)"/>
  <line x1="432" y1="184" x2="489" y2="184" stroke="#2f454a" stroke-width="1" marker-end="url(#roll-arrow)"/>

  <!-- phase 1: the release that bumps a family ships the upgrade with it -->
  <text x="12" y="278" fill="#40565a" font-size="12" font-weight="600" font-family="'IBM Plex Mono', monospace" letter-spacing="0.04em">1 · THE RELEASE THAT</text>
  <text x="12" y="294" fill="#40565a" font-size="12" font-weight="600" font-family="'IBM Plex Mono', monospace" letter-spacing="0.04em">BUMPS A FAMILY SHIPS</text>
  <text x="12" y="310" fill="#40565a" font-size="12" font-weight="600" font-family="'IBM Plex Mono', monospace" letter-spacing="0.04em">THE UPGRADE WITH IT</text>

  <rect x="12" y="324" width="172" height="108" rx="6" fill="rgba(145,59,12,0.08)" stroke="#913b0c" stroke-width="1.2"/>
  <text x="98" y="348" fill="#743008" font-size="14" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">the new writer</text>
  <text x="98" y="370" fill="#2f454a" font-size="12" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">the forecast release</text>
  <text x="98" y="386" fill="#2f454a" font-size="12" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">that embeds the</text>
  <text x="98" y="402" fill="#2f454a" font-size="12" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">new briefing</text>
  <text x="98" y="422" fill="#743008" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="middle">schemaVersion: 2</text>

  <rect x="492" y="324" width="216" height="84" rx="6" fill="#fffdf8" stroke="#776956" stroke-width="1"/>
  <text x="600" y="348" fill="#152529" font-size="14" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">new briefing released</text>
  <text x="600" y="370" fill="#2f454a" font-size="12" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">parses v2 and everything</text>
  <text x="600" y="386" fill="#2f454a" font-size="12" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">before it</text>

  <!-- dataset: v2 current documents with the v1 archives, through both phases -->
  <rect x="252" y="352" width="180" height="348" rx="6" fill="rgba(21,37,41,0.05)" stroke="#40565a" stroke-width="1"/>
  <text x="342" y="378" fill="#152529" font-size="14" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">v2 current documents</text>
  <text x="342" y="396" fill="#152529" font-size="14" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">· v1 archives stay</text>
  <text x="342" y="414" fill="#152529" font-size="14" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">on the wire</text>
  <text x="342" y="440" fill="#2f454a" font-size="12" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">month archives are</text>
  <text x="342" y="456" fill="#2f454a" font-size="12" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">append-only and immutable;</text>
  <text x="342" y="472" fill="#2f454a" font-size="12" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">a guard never drops</text>
  <text x="342" y="488" fill="#2f454a" font-size="12" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">a version</text>

  <!-- phase 1 arrows: the new briefing is embedded in the new writer, which emits only v2 -->
  <text x="342" y="330" fill="#40565a" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle">EMBEDDED IN</text>
  <line x1="492" y1="338" x2="187" y2="338" stroke="#2f454a" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#roll-arrow)"/>
  <text x="218" y="390" fill="#743008" font-size="11" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">EMITS</text>
  <text x="218" y="403" fill="#743008" font-size="11" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">ONLY v2</text>
  <line x1="184" y1="412" x2="249" y2="412" stroke="#913b0c" stroke-width="1.2" marker-end="url(#roll-arrow-accent)"/>

  <!-- phase 2: consumers upgrade at their own pace, in any order -->
  <text x="12" y="472" fill="#40565a" font-size="12" font-weight="600" font-family="'IBM Plex Mono', monospace" letter-spacing="0.04em">2 · CONSUMERS UPGRADE</text>
  <text x="12" y="488" fill="#40565a" font-size="12" font-weight="600" font-family="'IBM Plex Mono', monospace" letter-spacing="0.04em">AT THEIR OWN PACE,</text>
  <text x="12" y="504" fill="#40565a" font-size="12" font-weight="600" font-family="'IBM Plex Mono', monospace" letter-spacing="0.04em">IN ANY ORDER</text>

  <!-- release rule callout -->
  <rect x="12" y="524" width="2" height="124" fill="#776956" fill-opacity="0.7"/>
  <text x="24" y="536" fill="#40565a" font-size="11" font-weight="600" font-family="'IBM Plex Mono', monospace" letter-spacing="0.1em">THE RELEASE RULE</text>
  <text x="24" y="558" fill="#2f454a" font-size="13" font-style="italic" font-family="'IBM Plex Sans', sans-serif">never move a writer</text>
  <text x="24" y="576" fill="#2f454a" font-size="13" font-style="italic" font-family="'IBM Plex Sans', sans-serif">to a version no</text>
  <text x="24" y="594" fill="#2f454a" font-size="13" font-style="italic" font-family="'IBM Plex Sans', sans-serif">released reader parses</text>
  <text x="24" y="616" fill="#40565a" font-size="12" font-family="'IBM Plex Sans', sans-serif">everything else is a pin</text>
  <text x="24" y="632" fill="#40565a" font-size="12" font-family="'IBM Plex Sans', sans-serif">bump on the consumer's</text>
  <text x="24" y="648" fill="#40565a" font-size="12" font-family="'IBM Plex Sans', sans-serif">own schedule</text>

  <rect x="492" y="464" width="216" height="104" rx="6" fill="rgba(47,69,74,0.06)" stroke="#40565a" stroke-width="1"/>
  <text x="600" y="488" fill="#152529" font-size="14" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">pin bumped early</text>
  <text x="600" y="506" fill="#152529" font-size="14" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">any order</text>
  <text x="600" y="528" fill="#2f454a" font-size="12" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">keeps parsing the old</text>
  <text x="600" y="544" fill="#2f454a" font-size="12" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">documents still being</text>
  <text x="600" y="560" fill="#2f454a" font-size="12" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">published</text>

  <rect x="492" y="584" width="216" height="188" rx="6" fill="rgba(47,69,74,0.06)" stroke="#40565a" stroke-width="1"/>
  <text x="600" y="608" fill="#152529" font-size="14" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">pin bumped late</text>
  <text x="600" y="626" fill="#152529" font-size="14" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">keeps serving</text>
  <text x="600" y="648" fill="#2f454a" font-size="12" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">only symptom, on new documents:</text>
  <text x="600" y="668" fill="#152529" font-size="12" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">{ miss: "invalid" }</text>
  <text x="600" y="686" fill="#2f454a" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="middle">declaredSchemaVersion: 2</text>
  <text x="600" y="702" fill="#2f454a" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="middle">· supported 1</text>
  <text x="600" y="724" fill="#2f454a" font-size="12" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">upgrade the package, not debug</text>
  <text x="600" y="740" fill="#2f454a" font-size="12" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">bytes; an ingest serves what it</text>
  <text x="600" y="756" fill="#2f454a" font-size="12" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">last stored: stale, never wrong</text>

  <!-- phase 2 arrows: the dataset reaches both readers -->
  <line x1="432" y1="516" x2="489" y2="516" stroke="#2f454a" stroke-width="1" marker-end="url(#roll-arrow)"/>
  <line x1="432" y1="640" x2="489" y2="640" stroke="#2f454a" stroke-width="1" marker-end="url(#roll-arrow)"/>
</svg>

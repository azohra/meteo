  <rect x="364" y="646" width="32" height="8" fill="none" stroke="rgba(119,105,86,0.7)" stroke-width="0.8"/>
  <rect x="364" y="646" width="30" height="8" fill="rgba(21,37,41,0.4)"/>
  <rect x="406" y="646" width="16" height="8" fill="none" stroke="rgba(119,105,86,0.7)" stroke-width="0.8"/>
  <rect x="406" y="646" width="14" height="8" fill="rgba(21,37,41,0.4)"/>
  <text x="460" y="638" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#40565a">an interior silent year stays —</text>
  <text x="460" y="648" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#40565a">it records a real outage;</text>
  <text x="460" y="658" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#40565a">leading pre-station years trimmed</text>

  <!-- the views -->
  <text x="716" y="48" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" letter-spacing="0.1em" fill="#40565a">READING IT — FOUR VIEWS, ONE HELD DOCUMENT</text>
  <text x="716" y="68" font-family="'IBM Plex Sans', sans-serif" font-size="11" font-style="italic" fill="#2f454a">every view is a pure function of the document and</text>
  <text x="716" y="84" font-family="'IBM Plex Sans', sans-serif" font-size="11" font-style="italic" fill="#2f454a">its filters — a filter change re-sums, never refetches</text>

  <rect x="716" y="96" width="320" height="100" rx="6" fill="#fffdf8" stroke="#776956" stroke-width="1"/>
  <text x="732" y="122" font-family="'IBM Plex Mono', monospace" font-size="10.5" font-weight="600" fill="#152529">climatologyRose(doc, {months?, slots?})</text>
  <text x="732" y="142" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#2f454a">collapse month and slot into per-sector</text>
  <text x="732" y="158" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#2f454a">totals; each keeps its bandCounts stack</text>
  <text x="732" y="182" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#40565a">-> WindRoseSummary</text>

  <rect x="716" y="220" width="320" height="100" rx="6" fill="#fffdf8" stroke="#776956" stroke-width="1"/>
  <text x="732" y="246" font-family="'IBM Plex Mono', monospace" font-size="10.5" font-weight="600" fill="#152529">climatologyPattern(doc, {months?})</text>
  <text x="732" y="266" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#2f454a">collapse month and sector; vector-average</text>
  <text x="732" y="282" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#2f454a">each slot from its uSum and vSum</text>
  <text x="732" y="306" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#40565a">-> DailyPatternSlot[]</text>

  <rect x="716" y="344" width="320" height="100" rx="6" fill="#fffdf8" stroke="#776956" stroke-width="1"/>
  <text x="732" y="370" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" fill="#152529">climatologyFavorableShare(doc, arcs, filters?)</text>
  <text x="732" y="390" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#2f454a">share of the filtered non-calm record inside</text>
  <text x="732" y="406" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#2f454a">the arcs, judged at sector centres</text>
  <text x="732" y="430" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#40565a">-> share; null when nothing non-calm</text>

  <text x="716" y="592" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" font-style="italic" fill="#2f454a">coverage reads the ledger, not the cells</text>
  <rect x="716" y="604" width="320" height="64" rx="6" fill="#fffdf8" stroke="#776956" stroke-width="1"/>
  <text x="732" y="628" font-family="'IBM Plex Mono', monospace" font-size="10.5" font-weight="600" fill="#152529">climatologyCoverage(doc)</text>
  <text x="732" y="646" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#2f454a">sums the ledger: samples held against</text>
  <text x="732" y="662" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#2f454a">a gapless station's expectation</text>
</svg>

  <rect x="292" y="284" width="32" height="22" fill="#f2dcc1" stroke="#913b0c" stroke-width="1.2"/>

  <text x="92" y="144" font-family="'IBM Plex Mono', monospace" font-size="9.5" text-anchor="end" fill="#40565a">00</text>
  <text x="92" y="166" font-family="'IBM Plex Mono', monospace" font-size="9.5" text-anchor="end" fill="#40565a">03</text>

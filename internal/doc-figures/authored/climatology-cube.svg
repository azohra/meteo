  <text x="518" y="302" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#2f454a">absent — never</text>
  <text x="518" y="318" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#2f454a">zero-filled</text>


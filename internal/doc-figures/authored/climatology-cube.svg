  <!-- axis notes and legend, right of the grid -->
  <text x="500" y="148" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#2f454a">slot = floor(minute</text>
  <text x="500" y="162" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#2f454a">/ slotMinutes)</text>
  <text x="500" y="182" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#40565a">standard time, no DST</text>
  <text x="500" y="202" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#40565a">here: 180 min -> 8 slots</text>
  <text x="500" y="216" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#40565a">sectorCount 16 (min 4)</text>
  <rect x="500" y="234" width="12" height="12" fill="rgba(21,37,41,0.06)" stroke="rgba(119,105,86,0.4)" stroke-width="0.8"/>
  <text x="518" y="244" font-family="'IBM Plex Sans', sans-serif" font-size="10" fill="#2f454a">bucket holds records</text>
  <rect x="500" y="258" width="12" height="12" fill="#f2f4f1" stroke="rgba(119,105,86,0.4)" stroke-width="0.8"/>
  <text x="518" y="268" font-family="'IBM Plex Sans', sans-serif" font-size="10" fill="#2f454a">absent — never</text>
  <text x="518" y="282" font-family="'IBM Plex Sans', sans-serif" font-size="10" fill="#2f454a">zero-filled</text>

  <!-- zoom into one cell -->

  <!-- axis notes and legend, right of the grid -->
  <text x="496" y="166" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#2f454a">slot = floor(minute</text>
  <text x="496" y="182" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#2f454a">/ slotMinutes)</text>
  <text x="496" y="206" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a">standard time, no DST</text>
  <text x="496" y="230" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a">here: 180 min -&gt; 8 slots</text>
  <text x="496" y="246" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a">sectorCount 16 (min 4)</text>
  <rect x="496" y="264" width="14" height="14" fill="rgba(21,37,41,0.06)" stroke="rgba(119,105,86,0.4)" stroke-width="0.8"/>
  <text x="518" y="276" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#2f454a">bucket holds records</text>

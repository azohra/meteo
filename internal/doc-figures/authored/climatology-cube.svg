  <text x="217" y="398" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" letter-spacing="0.06em" text-anchor="middle" fill="#2f454a">ONE CELL — MONTH 7 · SLOT 7 (SCHEMATIC)</text>
  <text x="52" y="428" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#152529">sampleCount — all records in the bucket, calm included</text>
  <text x="52" y="446" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#152529">calmCount — calm belongs to the bucket, not a sector: calm has no direction</text>
  <text x="52" y="472" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#152529">sectors — the third axis, inside the cell</text>
  <text x="420" y="472" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a">bearing = sector * 22.5 deg</text>

  <rect x="336" y="468" width="28" height="16" fill="rgba(21,37,41,0.05)" stroke="rgba(119,105,86,0.5)" stroke-width="0.8"/>
  <rect x="368" y="468" width="28" height="16" fill="rgba(21,37,41,0.05)" stroke="rgba(119,105,86,0.5)" stroke-width="0.8"/>
  <rect x="400" y="468" width="28" height="16" fill="rgba(21,37,41,0.05)" stroke="rgba(119,105,86,0.5)" stroke-width="0.8"/>

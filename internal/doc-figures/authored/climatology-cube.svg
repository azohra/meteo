  <text x="440" y="722" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#40565a">an interior silent year stays —</text>
  <text x="440" y="736" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#40565a">it records a real outage;</text>
  <text x="440" y="750" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#40565a">leading pre-station years trimmed</text>

  <!-- arrow: document -> views -->
  <line x1="600" y1="776" x2="600" y2="800" stroke="#2f454a" stroke-width="1.2" marker-end="url(#clim-arrow)"/>

  <!-- the views -->
  <text x="24" y="818" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#40565a">READING IT — FOUR VIEWS, ONE HELD DOCUMENT</text>
  <text x="24" y="836" font-family="'IBM Plex Sans', sans-serif" font-size="12" font-style="italic" fill="#2f454a">every view is a pure function of the document and its filters — a filter change re-sums, never refetches</text>

  <rect x="24" y="848" width="672" height="84" rx="6" fill="#fffdf8" stroke="#776956" stroke-width="1"/>
  <text x="40" y="872" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="600" fill="#152529">climatologyRose(doc, {months?, slots?})</text>
  <text x="40" y="894" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#2f454a">collapse month and slot into per-sector totals; each keeps its bandCounts stack</text>
  <text x="40" y="916" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a">-&gt; WindRoseSummary</text>

  <rect x="24" y="942" width="672" height="84" rx="6" fill="#fffdf8" stroke="#776956" stroke-width="1"/>
  <text x="40" y="966" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="600" fill="#152529">climatologyPattern(doc, {months?})</text>
  <text x="40" y="988" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#2f454a">collapse month and sector; vector-average each slot from its uSum and vSum</text>
  <text x="40" y="1010" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a">-&gt; DailyPatternSlot[]</text>

  <rect x="24" y="1036" width="672" height="84" rx="6" fill="#fffdf8" stroke="#776956" stroke-width="1"/>
  <text x="40" y="1060" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="600" fill="#152529">climatologyFavorableShare(doc, arcs, filters?)</text>
  <text x="40" y="1082" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#2f454a">share of the filtered non-calm record inside the arcs, judged at sector centres</text>
  <text x="40" y="1104" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a">-&gt; share; null when nothing non-calm</text>

  <text x="24" y="1144" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-style="italic" fill="#2f454a">coverage reads the ledger, not the cells</text>
  <rect x="24" y="1154" width="672" height="64" rx="6" fill="#fffdf8" stroke="#776956" stroke-width="1"/>
  <text x="40" y="1178" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="600" fill="#152529">climatologyCoverage(doc)</text>
  <text x="40" y="1200" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#2f454a">sums the ledger: samples held against a gapless station's expectation</text>
</svg>

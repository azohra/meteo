  <rect x="100" y="374" width="536" height="164" rx="6" fill="#fffdf8" stroke="#913b0c" stroke-width="1.2"/>
  <rect x="112" y="386" width="216" height="15" rx="2" fill="transparent" stroke="rgba(21,37,41,0.4)" stroke-width="0.8"/>
  <text x="220" y="397" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="600" letter-spacing="0.06em" text-anchor="middle" fill="#2f454a">ONE CELL — MONTH 7 · SLOT 7 (SCHEMATIC)</text>
  <text x="112" y="422" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#152529">sampleCount — all records in the bucket, calm included</text>
  <text x="112" y="438" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#152529">calmCount — calm belongs to the bucket, not a sector: calm has no direction</text>
  <text x="112" y="460" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" font-weight="600" fill="#152529">sectors — the third axis, inside the cell</text>
  <text x="368" y="460" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#40565a">bearing = sector * 22.5 deg</text>
  <rect x="112" y="468" width="28" height="16" fill="rgba(21,37,41,0.05)" stroke="rgba(119,105,86,0.5)" stroke-width="0.8"/>
  <rect x="144" y="468" width="28" height="16" fill="rgba(21,37,41,0.05)" stroke="rgba(119,105,86,0.5)" stroke-width="0.8"/>

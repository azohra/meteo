  <rect x="622" y="482" width="34" height="20" fill="rgba(21,37,41,0.05)" stroke="rgba(119,105,86,0.5)" stroke-width="0.8"/>
  <text x="69" y="518" font-family="'IBM Plex Mono', monospace" font-size="12" text-anchor="middle" fill="#40565a">0</text>
  <text x="639" y="518" font-family="'IBM Plex Mono', monospace" font-size="12" text-anchor="middle" fill="#40565a">15</text>
  <text x="52" y="540" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#2f454a">each: count · uSum · vSum · speedSumMps · bandCounts[thresholds+1] · maxGustMps</text>
  <text x="52" y="560" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-style="italic" fill="#2f454a">sums, not means — any month / season / slot filter re-aggregates losslessly</text>

  <!-- declarations riding beside the cells -->
  <text x="40" y="598" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" letter-spacing="0.1em" fill="#40565a">DECLARED BESIDE THE CELLS</text>
  <rect x="40" y="608" width="312" height="56" rx="6" fill="#fffdf8" stroke="rgba(119,105,86,0.6)" stroke-width="1"/>
  <text x="52" y="630" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#152529">thresholdsMps — the consumer's bounds</text>
  <text x="52" y="650" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#2f454a">the package ships no default</text>
  <rect x="368" y="608" width="312" height="56" rx="6" fill="#fffdf8" stroke="rgba(119,105,86,0.6)" stroke-width="1"/>
  <text x="380" y="630" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#152529">utcOffsetMinutes — standard, no DST</text>
  <text x="380" y="650" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#2f454a">same solar hours in January and July</text>


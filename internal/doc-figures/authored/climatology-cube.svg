  <rect x="464" y="468" width="28" height="16" fill="rgba(21,37,41,0.05)" stroke="rgba(119,105,86,0.5)" stroke-width="0.8"/>
  <rect x="496" y="468" width="28" height="16" fill="rgba(21,37,41,0.05)" stroke="rgba(119,105,86,0.5)" stroke-width="0.8"/>
  <rect x="528" y="468" width="28" height="16" fill="rgba(21,37,41,0.05)" stroke="rgba(119,105,86,0.5)" stroke-width="0.8"/>
  <rect x="560" y="468" width="28" height="16" fill="rgba(21,37,41,0.05)" stroke="rgba(119,105,86,0.5)" stroke-width="0.8"/>
  <rect x="592" y="468" width="28" height="16" fill="rgba(21,37,41,0.05)" stroke="rgba(119,105,86,0.5)" stroke-width="0.8"/>
  <text x="126" y="496" font-family="'IBM Plex Mono', monospace" font-size="8" text-anchor="middle" fill="#40565a">0</text>
  <text x="606" y="496" font-family="'IBM Plex Mono', monospace" font-size="8" text-anchor="middle" fill="#40565a">15</text>
  <text x="112" y="512" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#2f454a">each: count · uSum · vSum · speedSumMps · bandCounts[thresholds+1] · maxGustMps</text>
  <text x="112" y="530" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" font-style="italic" fill="#2f454a">sums, not means — any month / season / slot filter re-aggregates losslessly</text>

  <!-- declarations riding beside the cells -->
  <text x="100" y="558" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="600" letter-spacing="0.1em" fill="#40565a">DECLARED BESIDE THE CELLS</text>
  <rect x="100" y="566" width="260" height="52" rx="6" fill="#fffdf8" stroke="rgba(119,105,86,0.6)" stroke-width="1"/>
  <text x="112" y="586" font-family="'IBM Plex Sans', sans-serif" font-size="10" font-weight="600" fill="#152529">thresholdsMps — the consumer's bounds</text>
  <text x="112" y="602" font-family="'IBM Plex Sans', sans-serif" font-size="10" fill="#2f454a">the package ships no default</text>
  <rect x="376" y="566" width="260" height="52" rx="6" fill="#fffdf8" stroke="rgba(119,105,86,0.6)" stroke-width="1"/>
  <text x="388" y="586" font-family="'IBM Plex Sans', sans-serif" font-size="10" font-weight="600" fill="#152529">utcOffsetMinutes — standard, no DST</text>
  <text x="388" y="602" font-family="'IBM Plex Sans', sans-serif" font-size="10" fill="#2f454a">same solar hours in January and July</text>

  <!-- the coverage ledger -->
  <rect x="100" y="626" width="536" height="34" rx="6" fill="#fffdf8" stroke="rgba(119,105,86,0.6)" stroke-width="1"/>
  <text x="112" y="640" font-family="'IBM Plex Sans', sans-serif" font-size="10" font-weight="600" fill="#152529">years — the ledger, oldest first</text>
  <text x="300" y="640" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#40565a">sampleCount vs expectedCount</text>
  <rect x="112" y="646" width="32" height="8" fill="none" stroke="rgba(119,105,86,0.7)" stroke-width="0.8"/>
  <rect x="112" y="646" width="30" height="8" fill="rgba(21,37,41,0.4)"/>

  <text x="40" y="62" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" letter-spacing="0.08em" fill="#40565a">STATIONCLIMATOLOGY — ONE DOCUMENT, ITS OWN SCHEMA VERSION</text>
  <text x="40" y="82" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#2f454a">the whole archive as one (month, slot-of-day, sector) cube of sums</text>


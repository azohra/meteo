  <text x="436" y="122" font-family="'IBM Plex Mono', monospace" font-size="9.5" text-anchor="middle" fill="#40565a">N</text>
  <text x="468" y="122" font-family="'IBM Plex Mono', monospace" font-size="9.5" text-anchor="middle" fill="#40565a">D</text>

  <rect x="100" y="130" width="384" height="176" fill="rgba(21,37,41,0.06)"/>

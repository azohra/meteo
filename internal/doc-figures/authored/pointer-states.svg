<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 472">
  <defs><marker id="ptr-head" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2f454a"/></marker></defs>

  <rect x="64" y="40" width="232" height="92" rx="10" fill="#fffdf8" stroke="#2f454a" stroke-width="1.4"/>
  <text x="180" y="78" font-family="'Big Shoulders', sans-serif" font-size="16" font-weight="800" letter-spacing="0.32" fill="#152529" text-anchor="middle">RESTING</text>
  <text x="180" y="100" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#40565a" text-anchor="middle">selection shown is the</text>
  <text x="180" y="116" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#40565a" text-anchor="middle">stored (or initial) one</text>

  <rect x="600" y="40" width="248" height="92" rx="10" fill="#fffdf8" stroke="#2f454a" stroke-width="1.4"/>
  <text x="724" y="78" font-family="'Big Shoulders', sans-serif" font-size="16" font-weight="800" letter-spacing="0.32" fill="#152529" text-anchor="middle">PREVIEWING</text>
  <text x="724" y="100" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#40565a" text-anchor="middle">consumer overlay tracks</text>
  <text x="724" y="116" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#40565a" text-anchor="middle">the pointer, nothing stored</text>

  <rect x="392" y="236" width="256" height="104" rx="10" fill="#f2dcc1" stroke="#913b0c" stroke-width="2"/>
  <text x="520" y="280" font-family="'Big Shoulders', sans-serif" font-size="16" font-weight="800" letter-spacing="0.32" fill="#152529" text-anchor="middle">PINNED</text>
  <text x="520" y="302" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#40565a" text-anchor="middle">selection stored; rebuild</text>
  <text x="520" y="318" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#40565a" text-anchor="middle">with the selection option</text>

  <path d="M296 70 H596" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#ptr-head)"/>
  <text x="446" y="58" font-family="'IBM Plex Sans', sans-serif" font-size="11" font-weight="600" fill="#2f454a" text-anchor="middle">pointermove · not touch</text>

  <path d="M600 108 H300" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#ptr-head)"/>
  <text x="446" y="128" font-family="'IBM Plex Sans', sans-serif" font-size="11" font-weight="600" fill="#2f454a" text-anchor="middle">pointerleave</text>

  <path d="M724 132 V258 Q724 268 714 268 H652" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#ptr-head)"/>
  <text x="738" y="196" font-family="'IBM Plex Sans', sans-serif" font-size="11" font-weight="600" fill="#2f454a">click / tap</text>

  <path d="M124 132 V300 Q124 310 134 310 H388" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#ptr-head)"/>
  <text x="140" y="206" font-family="'IBM Plex Sans', sans-serif" font-size="11" font-weight="600" fill="#2f454a">click / tap</text>
  <text x="140" y="224" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#40565a">a touch pointer pins without previewing</text>

  <path d="M472 236 V190 Q472 180 462 180 H242 Q232 180 232 170 V136" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#ptr-head)"/>
  <text x="352" y="166" font-family="'IBM Plex Sans', sans-serif" font-size="11" font-weight="600" fill="#2f454a" text-anchor="middle">click the pinned target again · Escape</text>

  <path d="M648 300 C688 300 688 320 652 320" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#ptr-head)"/>
  <text x="696" y="314" font-family="'IBM Plex Sans', sans-serif" font-size="11" font-weight="600" fill="#2f454a">re-pin</text>

  <path d="M520 340 V396" stroke="#2f454a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ptr-head)"/>
  <rect x="360" y="400" width="320" height="52" rx="8" fill="#f2f4f1" stroke="#776956"/>
  <text x="520" y="422" font-family="'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="700" fill="#152529" text-anchor="middle">model / day swap</text>
  <text x="520" y="440" font-family="'IBM Plex Sans', sans-serif" font-size="10.5" fill="#40565a" text-anchor="middle">reset, or carry by validAt; consumer decides</text>
</svg>

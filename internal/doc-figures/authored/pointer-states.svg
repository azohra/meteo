<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510">
  <defs><marker id="ptr-head" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2f454a"/></marker></defs>

  <rect x="30" y="40" width="220" height="100" rx="10" fill="#fffdf8" stroke="#2f454a" stroke-width="1.4"/>
  <text x="140" y="78" font-family="'Big Shoulders', sans-serif" font-size="18" font-weight="800" letter-spacing="0.36" fill="#152529" text-anchor="middle">RESTING</text>
  <text x="140" y="102" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#40565a" text-anchor="middle">selection shown is the</text>
  <text x="140" y="120" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#40565a" text-anchor="middle">stored (or initial) one</text>

  <rect x="470" y="40" width="220" height="100" rx="10" fill="#fffdf8" stroke="#2f454a" stroke-width="1.4"/>
  <text x="580" y="78" font-family="'Big Shoulders', sans-serif" font-size="18" font-weight="800" letter-spacing="0.36" fill="#152529" text-anchor="middle">PREVIEWING</text>
  <text x="580" y="102" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#40565a" text-anchor="middle">consumer overlay tracks</text>
  <text x="580" y="120" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#40565a" text-anchor="middle">the pointer, nothing stored</text>

  <rect x="230" y="270" width="260" height="110" rx="10" fill="#f2dcc1" stroke="#913b0c" stroke-width="2"/>
  <text x="360" y="312" font-family="'Big Shoulders', sans-serif" font-size="18" font-weight="800" letter-spacing="0.36" fill="#152529" text-anchor="middle">PINNED</text>
  <text x="360" y="336" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#40565a" text-anchor="middle">selection stored; rebuild</text>
  <text x="360" y="354" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#40565a" text-anchor="middle">with the selection option</text>

  <!-- resting and previewing -->
  <path d="M250 74 H466" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#ptr-head)"/>
  <text x="360" y="62" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#2f454a" text-anchor="middle">pointermove · not touch</text>

  <path d="M470 112 H254" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#ptr-head)"/>
  <text x="360" y="132" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#2f454a" text-anchor="middle">pointerleave</text>

  <!-- into pinned -->
  <path d="M640 140 V290 Q640 300 630 300 H494" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#ptr-head)"/>
  <text x="652" y="224" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#2f454a">click / tap</text>

  <path d="M80 140 V340 Q80 350 90 350 H226" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#ptr-head)"/>
  <text x="96" y="232" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#2f454a">click / tap</text>
  <text x="96" y="250" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#40565a">a touch pointer pins without previewing</text>

  <!-- out of pinned -->
  <path d="M440 270 V210 Q440 200 430 200 H200 Q190 200 190 190 V144" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#ptr-head)"/>
  <text x="332" y="190" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#2f454a" text-anchor="middle">click the pinned target again · Escape</text>

  <path d="M490 318 C534 318 534 348 494 348" stroke="#2f454a" stroke-width="1.5" fill="none" marker-end="url(#ptr-head)"/>
  <text x="542" y="338" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#2f454a">re-pin</text>

  <!-- the swap -->
  <path d="M360 380 V426" stroke="#2f454a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ptr-head)"/>
  <rect x="170" y="430" width="380" height="62" rx="8" fill="#f2f4f1" stroke="#776956"/>
  <text x="360" y="455" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="700" fill="#152529" text-anchor="middle">model / day swap</text>
  <text x="360" y="476" font-family="'IBM Plex Sans', sans-serif" font-size="12.5" fill="#40565a" text-anchor="middle">reset, or carry by validAt; consumer decides</text>
</svg>

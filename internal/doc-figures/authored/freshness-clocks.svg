<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 712">
  <defs>
    <marker id="fresh-arrowhead" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2f454a"/>
    </marker>
  </defs>

  <!-- axis header: 9 px per true second, 12:00:40 at x=160 -->
  <text x="0" y="14" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#2f454a">true clock · UTC</text>
  <text x="160" y="34" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a" text-anchor="middle">12:00:40</text>
  <text x="250" y="34" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a" text-anchor="middle">12:00:50</text>
  <text x="340" y="34" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a" text-anchor="middle">12:01:00</text>
  <text x="430" y="34" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a" text-anchor="middle">12:01:10</text>
  <text x="520" y="34" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a" text-anchor="middle">12:01:20</text>
  <text x="610" y="34" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a" text-anchor="middle">12:01:30</text>
  <text x="700" y="34" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a" text-anchor="middle">12:01:40</text>

  <!-- lane bands -->
  <rect x="150" y="48" width="570" height="64" fill="#f2f4f1"/>
  <rect x="150" y="124" width="570" height="64" fill="#f2f4f1"/>
  <rect x="150" y="200" width="570" height="68" fill="#f2f4f1"/>

  <!-- shared true-time gridlines -->
  <line x1="160" y1="40" x2="160" y2="276" stroke="rgba(119,105,86,0.35)" stroke-width="1"/>
  <line x1="250" y1="40" x2="250" y2="276" stroke="rgba(119,105,86,0.35)" stroke-width="1"/>
  <line x1="340" y1="40" x2="340" y2="276" stroke="rgba(119,105,86,0.35)" stroke-width="1"/>
  <line x1="430" y1="40" x2="430" y2="276" stroke="rgba(119,105,86,0.35)" stroke-width="1"/>
  <line x1="520" y1="40" x2="520" y2="276" stroke="rgba(119,105,86,0.35)" stroke-width="1"/>
  <line x1="610" y1="40" x2="610" y2="276" stroke="rgba(119,105,86,0.35)" stroke-width="1"/>
  <line x1="700" y1="40" x2="700" y2="276" stroke="rgba(119,105,86,0.35)" stroke-width="1"/>

  <!-- lane rail labels -->
  <text x="0" y="74" font-family="'Big Shoulders', sans-serif" font-size="16" font-weight="800" letter-spacing="0.4" fill="#152529">STATION</text>
  <text x="0" y="92" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a">stamps the reading</text>
  <text x="0" y="150" font-family="'Big Shoulders', sans-serif" font-size="16" font-weight="800" letter-spacing="0.4" fill="#152529">SERVER</text>
  <text x="0" y="168" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a">stamps the response</text>
  <text x="0" y="226" font-family="'Big Shoulders', sans-serif" font-size="16" font-weight="800" letter-spacing="0.4" fill="#152529">CLIENT</text>
  <text x="0" y="244" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a">wall clock</text>
  <text x="0" y="260" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a">4 min fast</text>

  <!-- dashed drops from events to the measure brackets -->
  <line x1="205" y1="108" x2="205" y2="290" stroke="rgba(119,105,86,0.8)" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="340" y1="184" x2="340" y2="290" stroke="rgba(119,105,86,0.8)" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="403" y1="262" x2="403" y2="290" stroke="rgba(119,105,86,0.8)" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="673" y1="262" x2="673" y2="290" stroke="rgba(119,105,86,0.8)" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- handoff arrows: the reading rides to the server, the response rides to the client -->
  <path d="M211 82 H288 Q296 82 296 90 V150 Q296 158 304 158 H332" fill="none" stroke="#2f454a" stroke-width="1.2" marker-end="url(#fresh-arrowhead)"/>
  <path d="M346 158 H374 Q382 158 382 166 V226 Q382 234 388 234 H395" fill="none" stroke="#2f454a" stroke-width="1.2" marker-end="url(#fresh-arrowhead)"/>
  <text x="302" y="121" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a">reading</text>
  <text x="388" y="198" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a">response</text>

  <!-- the two age terms, each inside one clock domain -->
  <path d="M205 292 V300 H340 V292" fill="none" stroke="#743008" stroke-width="1.6"/>
  <path d="M403 292 V300 H673 V292" fill="none" stroke="#743008" stroke-width="1.6"/>
  <text x="272" y="320" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#743008" text-anchor="middle">servedAt - observedAt = 15 s</text>
  <text x="272" y="338" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a" text-anchor="middle">both stamps ride the wire</text>
  <text x="538" y="320" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#743008" text-anchor="middle">now - receivedAtMs = 30 s</text>
  <text x="538" y="338" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a" text-anchor="middle">both read on the client</text>

  <!-- event dots -->
  <circle cx="205" cy="82" r="5.5" fill="#152529" stroke="#fffdf8" stroke-width="1.5"/>
  <circle cx="340" cy="158" r="5.5" fill="#152529" stroke="#fffdf8" stroke-width="1.5"/>
  <circle cx="403" cy="234" r="5.5" fill="#152529" stroke="#fffdf8" stroke-width="1.5"/>
  <circle cx="673" cy="234" r="5.5" fill="#152529" stroke="#fffdf8" stroke-width="1.5"/>

  <!-- event labels -->
  <text x="205" y="69" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#152529" text-anchor="middle">observedAt</text>
  <text x="205" y="102" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#2f454a" text-anchor="middle">12:00:45Z</text>
  <text x="340" y="145" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#152529" text-anchor="middle">servedAt</text>
  <text x="340" y="178" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#2f454a" text-anchor="middle">12:01:00Z</text>
  <text x="403" y="257" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#152529" text-anchor="middle">receivedAtMs</text>
  <text x="415" y="238" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" fill="#743008">reads 12:05:07</text>
  <text x="673" y="257" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#152529" text-anchor="middle">now</text>
  <text x="661" y="238" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" fill="#743008" text-anchor="end">reads 12:05:37</text>

  <!-- verdict strip -->
  <rect x="0" y="352" width="720" height="120" fill="#f2f4f1" stroke="#913b0c" stroke-width="1.8"/>
  <text x="360" y="382" font-family="'Big Shoulders', sans-serif" font-size="19" font-weight="800" letter-spacing="0.4" fill="#152529" text-anchor="middle">AGE = (SERVEDAT - OBSERVEDAT) + (NOW - RECEIVEDATMS) = 45 S</text>
  <text x="360" y="405" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#2f454a" text-anchor="middle">the naive now - observedAt on this client's wall clock reads 4 min 52 s,</text>
  <text x="360" y="422" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#2f454a" text-anchor="middle">a live station misread as stale</text>
  <text x="360" y="444" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a" text-anchor="middle">each difference stays inside one clock domain,</text>
  <text x="360" y="460" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a" text-anchor="middle">so the client's 4-minute error never enters the sum</text>

  <!-- footer panels -->
  <rect x="0" y="488" width="720" height="108" fill="#fffdf8" stroke="rgba(119,105,86,0.6)" stroke-width="1"/>
  <text x="16" y="510" font-family="'Big Shoulders', sans-serif" font-size="15" font-weight="800" letter-spacing="0.5" fill="#152529">THE GRADE</text>
  <rect x="16" y="520" width="48" height="22" fill="#f2f4f1" stroke="rgba(119,105,86,0.9)" stroke-width="1"/>
  <text x="40" y="535" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" fill="#2f454a" text-anchor="middle">live</text>
  <text x="78" y="535" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a" text-anchor="middle">-&gt;</text>
  <rect x="92" y="520" width="60" height="22" fill="#f2f4f1" stroke="rgba(119,105,86,0.9)" stroke-width="1"/>
  <text x="122" y="535" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" fill="#2f454a" text-anchor="middle">aging</text>
  <text x="166" y="535" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a" text-anchor="middle">-&gt;</text>
  <rect x="180" y="520" width="60" height="22" fill="#f2f4f1" stroke="rgba(119,105,86,0.9)" stroke-width="1"/>
  <text x="210" y="535" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="600" fill="#2f454a" text-anchor="middle">stale</text>
  <text x="16" y="564" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#152529">freshness() grades the age into "live" | "aging" | "stale"; between polls</text>
  <text x="16" y="582" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#152529">every binding re-judges the same reading every 30 s, so a dead feed ages visibly</text>

  <rect x="0" y="608" width="720" height="96" fill="#fffdf8" stroke="rgba(119,105,86,0.6)" stroke-width="1"/>
  <text x="16" y="630" font-family="'Big Shoulders', sans-serif" font-size="15" font-weight="800" letter-spacing="0.5" fill="#152529">THE CUTOFFS</text>
  <text x="16" y="654" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#152529">stationFreshnessThresholds() scales them to the station's own cadence:</text>
  <text x="16" y="672" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#152529">ten minutes of silence is routine for a five-minute logger and a dead</text>
  <text x="16" y="690" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#152529">feed for a three-second one</text>
</svg>

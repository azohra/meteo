<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1036">
  <defs>
    <marker id="pf-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#40565a"/>
    </marker>
    <marker id="pf-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#913b0c"/>
    </marker>
  </defs>

  <!-- ground -->
  <rect width="720" height="1036" fill="#fffdf8"/>

  <!-- ================= loop fragment frame (zone, painted before lifelines) ================= -->
  <rect x="112" y="776" width="584" height="112" rx="4" fill="#f2f4f1" stroke="rgba(119,105,86,0.55)" stroke-width="1"/>
  <rect x="112" y="776" width="48" height="18" rx="2" fill="#fffdf8" stroke="rgba(119,105,86,0.55)" stroke-width="1"/>
  <text x="136" y="789" fill="#40565a" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
  <text x="172" y="790" fill="#40565a" font-size="12" font-family="'IBM Plex Mono', monospace">[runs disagree -> wait 1500 ms · refetch once]</text>

  <!-- ================= lifelines: the feed and job share the build phase, the job
       and dataset the publish phase, the dataset and reader the read phase ================= -->
  <line x1="150" y1="68" x2="150" y2="324" stroke="rgba(119,105,86,0.55)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="570" y1="68" x2="570" y2="672" stroke="rgba(119,105,86,0.55)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="150" y1="404" x2="150" y2="888" stroke="rgba(119,105,86,0.55)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="570" y1="760" x2="570" y2="888" stroke="rgba(119,105,86,0.55)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ================= activation bars ================= -->
  <rect x="566" y="112" width="8" height="504" fill="rgba(21,37,41,0.06)" stroke="#40565a" stroke-width="0.8"/>
  <rect x="146" y="112" width="8" height="56" fill="rgba(21,37,41,0.06)" stroke="#40565a" stroke-width="0.8"/>
  <rect x="146" y="200" width="8" height="56" fill="rgba(21,37,41,0.06)" stroke="#40565a" stroke-width="0.8"/>
  <rect x="146" y="440" width="8" height="176" fill="rgba(21,37,41,0.06)" stroke="#40565a" stroke-width="0.8"/>
  <rect x="146" y="812" width="8" height="64" fill="rgba(21,37,41,0.06)" stroke="#40565a" stroke-width="0.8"/>
  <rect x="566" y="812" width="8" height="64" fill="rgba(21,37,41,0.06)" stroke="#40565a" stroke-width="0.8"/>

  <!-- ================= BUILD ================= -->
  <line x1="24" y1="84" x2="696" y2="84" stroke="rgba(119,105,86,0.30)" stroke-width="0.8"/>
  <text x="24" y="102" fill="#743008" font-size="12" font-family="'IBM Plex Mono', monospace" letter-spacing="0.2em" font-weight="600">BUILD</text>
  <line x1="566" y1="128" x2="156" y2="128" stroke="#40565a" stroke-width="1" marker-end="url(#pf-arrow)"/>
  <text x="360" y="119" fill="#40565a" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="middle">newest complete run?</text>
  <line x1="154" y1="160" x2="564" y2="160" stroke="#40565a" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#pf-arrow)"/>
  <text x="360" y="151" fill="#40565a" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="middle">referenceTime · one run</text>
  <text x="556" y="188" fill="#40565a" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="end">[run already published -> skip]</text>
  <line x1="566" y1="216" x2="156" y2="216" stroke="#40565a" stroke-width="1" marker-end="url(#pf-arrow)"/>
  <text x="360" y="207" fill="#40565a" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="middle">GET declared fields · range reads</text>
  <line x1="154" y1="248" x2="564" y2="248" stroke="#40565a" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#pf-arrow)"/>
  <text x="360" y="239" fill="#40565a" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="middle">GRIB2 bytes</text>
  <path d="M 574 268 H 604 Q 612 268 612 276 V 292 Q 612 300 604 300 H 580"
        fill="none" stroke="#40565a" stroke-width="1" marker-end="url(#pf-arrow)"/>
  <text x="556" y="282" fill="#152529" font-size="12" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="end">sample · derive · round</text>
  <text x="556" y="299" fill="#40565a" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="end">writes local scratch tree data/&lt;model&gt;/</text>

  <!-- ================= PUBLISH ================= -->
  <line x1="24" y1="324" x2="696" y2="324" stroke="rgba(119,105,86,0.30)" stroke-width="0.8"/>
  <text x="24" y="342" fill="#743008" font-size="12" font-family="'IBM Plex Mono', monospace" letter-spacing="0.2em" font-weight="600">PUBLISH</text>
  <text x="556" y="428" fill="#40565a" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="end">[scratch older than published -> refuse]</text>
  <line x1="566" y1="464" x2="156" y2="464" stroke="#40565a" stroke-width="1" marker-end="url(#pf-arrow)"/>
  <circle cx="180" cy="450" r="9" fill="#fffdf8" stroke="#40565a" stroke-width="1"/>
  <text x="180" y="454" fill="#40565a" font-size="12" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">1</text>
  <text x="196" y="455" fill="#40565a" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="start">PUT history + sidecar indexes</text>
  <line x1="566" y1="500" x2="156" y2="500" stroke="#40565a" stroke-width="1" marker-end="url(#pf-arrow)"/>
  <circle cx="180" cy="486" r="9" fill="#fffdf8" stroke="#40565a" stroke-width="1"/>
  <text x="180" y="490" fill="#40565a" font-size="12" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">2</text>
  <text x="196" y="491" fill="#40565a" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="start">PUT site documents sites/&lt;id&gt;.json</text>
  <line x1="566" y1="536" x2="156" y2="536" stroke="#913b0c" stroke-width="1.2" marker-end="url(#pf-arrow-accent)"/>
  <circle cx="180" cy="522" r="9" fill="#f2dcc1" stroke="#913b0c" stroke-width="1"/>
  <text x="180" y="526" fill="#743008" font-size="12" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">3</text>
  <text x="196" y="527" fill="#743008" font-size="12" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="start">PUT manifest.json — the commit point</text>
  <line x1="566" y1="572" x2="156" y2="572" stroke="#40565a" stroke-width="1" marker-end="url(#pf-arrow)"/>
  <text x="172" y="563" fill="#40565a" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="start">GET read-back · must parse with reader's guard</text>
  <line x1="566" y1="608" x2="156" y2="608" stroke="#40565a" stroke-width="1" marker-end="url(#pf-arrow)"/>
  <circle cx="180" cy="594" r="9" fill="#fffdf8" stroke="#40565a" stroke-width="1"/>
  <text x="180" y="598" fill="#40565a" font-size="12" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">4</text>
  <text x="196" y="599" fill="#40565a" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="start">PUT runs.json — from published manifests</text>
  <text x="172" y="644" font-family="'IBM Plex Sans', sans-serif" font-style="italic" font-size="13" fill="#2f454a">Every object the manifest names is already live when it</text>
  <text x="172" y="662" font-family="'IBM Plex Sans', sans-serif" font-style="italic" font-size="13" fill="#2f454a">lands — a crash mid-publish never leaves a half-run.</text>

  <!-- ================= READ ================= -->
  <line x1="24" y1="680" x2="696" y2="680" stroke="rgba(119,105,86,0.30)" stroke-width="0.8"/>
  <text x="24" y="698" fill="#743008" font-size="12" font-family="'IBM Plex Mono', monospace" letter-spacing="0.2em" font-weight="600">READ</text>
  <line x1="566" y1="828" x2="156" y2="828" stroke="#40565a" stroke-width="1" marker-end="url(#pf-arrow)"/>
  <text x="360" y="819" fill="#40565a" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="middle">GET manifest + sites/&lt;id&gt;.json</text>
  <line x1="154" y1="864" x2="564" y2="864" stroke="#40565a" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#pf-arrow)"/>
  <text x="360" y="855" fill="#40565a" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="middle">the pair — render when runs agree</text>
  <text x="24" y="916" font-family="'IBM Plex Sans', sans-serif" font-style="italic" font-size="13" fill="#2f454a">A reader sees the previous run or the new one — never a blend. A torn pair</text>
  <text x="24" y="934" font-family="'IBM Plex Sans', sans-serif" font-style="italic" font-size="13" fill="#2f454a">is retried once, then flagged stale; it is never rendered as one.</text>

  <!-- ================= actor boxes (drawn after arrows) ================= -->
  <rect x="30" y="16" width="240" height="52" rx="6" fill="#fffdf8"/>
  <rect x="30" y="16" width="240" height="52" rx="6" fill="rgba(21,37,41,0.03)" stroke="rgba(21,37,41,0.35)" stroke-width="1"/>
  <rect x="38" y="23" width="32" height="16" rx="2" fill="none" stroke="rgba(21,37,41,0.35)" stroke-width="0.8"/>
  <text x="54.0" y="35" fill="rgba(21,37,41,0.7)" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
  <text x="164" y="39" fill="#152529" font-size="14" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">ECCC Datamart / NOAA</text>
  <text x="150" y="59" fill="#40565a" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="middle">one model run · GRIB2</text>
  <rect x="450" y="16" width="240" height="52" rx="6" fill="#fffdf8"/>
  <rect x="450" y="16" width="240" height="52" rx="6" fill="#fffdf8" stroke="#152529" stroke-width="1"/>
  <rect x="458" y="23" width="32" height="16" rx="2" fill="none" stroke="rgba(21,37,41,0.4)" stroke-width="0.8"/>
  <text x="474.0" y="35" fill="rgba(21,37,41,0.8)" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
  <text x="584" y="39" fill="#152529" font-size="14" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">meteo forecast job</text>
  <text x="570" y="59" fill="#40565a" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="middle">build -> publish · per model</text>
  <rect x="30" y="352" width="240" height="52" rx="6" fill="#fffdf8"/>
  <rect x="30" y="352" width="240" height="52" rx="6" fill="rgba(21,37,41,0.05)" stroke="#40565a" stroke-width="1"/>
  <rect x="38" y="359" width="44" height="16" rx="2" fill="none" stroke="rgba(64,86,90,0.5)" stroke-width="0.8"/>
  <text x="60.0" y="371" fill="rgba(64,86,90,0.9)" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
  <text x="164" y="375" fill="#152529" font-size="14" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">static dataset</text>
  <text x="150" y="395" fill="#40565a" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="middle">S3/R2 bucket · CDN-cached</text>
  <rect x="450" y="708" width="240" height="52" rx="6" fill="#fffdf8"/>
  <rect x="450" y="708" width="240" height="52" rx="6" fill="rgba(64,86,90,0.10)" stroke="rgba(47,69,74,0.8)" stroke-width="1"/>
  <rect x="458" y="715" width="32" height="16" rx="2" fill="none" stroke="rgba(47,69,74,0.5)" stroke-width="0.8"/>
  <text x="474.0" y="727" fill="rgba(47,69,74,0.9)" font-size="11" font-family="'IBM Plex Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
  <text x="584" y="731" fill="#152529" font-size="14" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">reader's browser</text>
  <text x="570" y="751" fill="#40565a" font-size="12" font-family="'IBM Plex Mono', monospace" text-anchor="middle">loadForecast() · transport</text>

  <!-- ================= legend ================= -->
  <line x1="24" y1="968" x2="696" y2="968" stroke="rgba(119,105,86,0.35)" stroke-width="0.8"/>
  <text x="24" y="994" fill="#40565a" font-size="11" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <line x1="100" y1="990" x2="136" y2="990" stroke="#40565a" stroke-width="1" marker-end="url(#pf-arrow)"/>
  <text x="144" y="994" fill="#40565a" font-size="12" font-family="'IBM Plex Mono', monospace">call</text>
  <line x1="200" y1="990" x2="236" y2="990" stroke="#40565a" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#pf-arrow)"/>
  <text x="244" y="994" fill="#40565a" font-size="12" font-family="'IBM Plex Mono', monospace">return</text>
  <line x1="316" y1="990" x2="352" y2="990" stroke="#913b0c" stroke-width="1.2" marker-end="url(#pf-arrow-accent)"/>
  <text x="360" y="994" fill="#743008" font-size="12" font-weight="600" font-family="'IBM Plex Mono', monospace">commit point</text>
  <circle cx="109" cy="1014" r="9" fill="#fffdf8" stroke="#40565a" stroke-width="1"/>
  <text x="109" y="1018" fill="#40565a" font-size="12" font-weight="600" font-family="'IBM Plex Mono', monospace" text-anchor="middle">n</text>
  <text x="126" y="1018" fill="#40565a" font-size="12" font-family="'IBM Plex Mono', monospace">upload order — nothing the manifest references lands after it</text>
</svg>

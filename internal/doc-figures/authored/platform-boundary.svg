<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 672">
  <defs>
    <marker id="platb-flow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2f454a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="672" fill="#fffdf8"/>

  <!-- sources: the forecast lane on the left, the station lane on the right -->
  <text x="220" y="22" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a">provider model files · GRIB2 · JPEG 2000</text>
  <text x="560" y="22" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a">weather-station hardware</text>

  <!-- decoders -->
  <rect x="40" y="48" width="360" height="96" rx="8" fill="#fffdf8" stroke="#776956" stroke-width="1.5"/>
  <text x="220" y="74" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="700" fill="#152529">@azohra/meteo.grib</text>
  <text x="220" y="93" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="700" fill="#152529">@azohra/meteo.j2k</text>
  <text x="220" y="116" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#2f454a">Decode provider bytes into typed grids,</text>
  <text x="220" y="133" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#2f454a">checked bit for bit against ecCodes.</text>

  <!-- forecast engine -->
  <rect x="40" y="168" width="360" height="96" rx="8" fill="#fffdf8" stroke="#776956" stroke-width="1.5"/>
  <text x="220" y="200" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="700" fill="#152529">@azohra/meteo.forecast</text>
  <text x="220" y="224" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#2f454a">Samples each launch, derives engine-owned</text>
  <text x="220" y="241" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#2f454a">values, and publishes documents.</text>

  <!-- the data boundary: versioned JSON documents, across the forecast lane only -->
  <rect x="24" y="286" width="392" height="80" fill="#f2dcc1"/>
  <path d="M24 286 H416 V366 H24 Z" stroke="#913b0c" stroke-width="1.6" stroke-dasharray="6 4" fill="none"/>
  <text x="220" y="311" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.5" fill="#743008">VERSIONED JSON DOCUMENTS</text>
  <text x="220" y="333" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#2f454a">manifest · site profiles</text>
  <text x="220" y="351" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#2f454a">month archives · site context</text>

  <!-- readers -->
  <rect x="40" y="388" width="360" height="96" rx="8" fill="#fffdf8" stroke="#776956" stroke-width="1.5"/>
  <text x="220" y="420" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="700" fill="#152529">@azohra/meteo.briefing</text>
  <text x="220" y="444" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#2f454a">Validates the documents, then derives,</text>
  <text x="220" y="461" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#2f454a">analyzes, compares, and draws the Meteogram.</text>

  <rect x="440" y="388" width="240" height="96" rx="8" fill="#fffdf8" stroke="#776956" stroke-width="1.5"/>
  <text x="560" y="416" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="700" fill="#152529">@azohra/meteo.station</text>
  <text x="560" y="439" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#2f454a">Adapters, feed handler, and</text>
  <text x="560" y="456" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#2f454a">display over its own live</text>
  <text x="560" y="473" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#2f454a">wire contract.</text>

  <!-- shared foundation beneath both readers -->
  <rect x="24" y="500" width="672" height="64" rx="6" fill="#f2f4f1" stroke="#776956" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="390" y="522" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" fill="#152529">@azohra/meteo.core</text>
  <text x="390" y="539" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#2f454a">units · one wind sign · failure vocabulary</text>
  <text x="390" y="555" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#40565a">imported by briefing and station</text>

  <!-- the operator: both lanes end here -->
  <rect x="24" y="584" width="672" height="76" rx="8" fill="#fffdf8" stroke="#152529" stroke-width="1.5"/>
  <text x="360" y="613" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.5" fill="#743008">THE OPERATOR</text>
  <text x="360" y="640" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#2f454a">hosting · schedule · access · presentation · safety language</text>

  <!-- arrows last: the forecast hand-off enters and leaves the documents
       band; the station wire runs beside it and never touches it -->
  <path d="M220 30 V44" stroke="#2f454a" stroke-width="1.6" fill="none" marker-end="url(#platb-flow)"/>
  <path d="M220 144 V164" stroke="#2f454a" stroke-width="1.6" fill="none" marker-end="url(#platb-flow)"/>
  <path d="M220 264 V282" stroke="#2f454a" stroke-width="1.6" fill="none" marker-end="url(#platb-flow)"/>
  <path d="M220 366 V384" stroke="#2f454a" stroke-width="1.6" fill="none" marker-end="url(#platb-flow)"/>
  <path d="M560 30 V384" stroke="#2f454a" stroke-width="1.6" fill="none" marker-end="url(#platb-flow)"/>
  <text x="572" y="322" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a">never crosses</text>
  <text x="572" y="338" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#40565a">the JSON boundary</text>
  <path d="M220 484 V580" stroke="#2f454a" stroke-width="1.6" fill="none" marker-end="url(#platb-flow)"/>
  <path d="M560 484 V580" stroke="#2f454a" stroke-width="1.6" fill="none" marker-end="url(#platb-flow)"/>
</svg>

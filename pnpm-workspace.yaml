# mise selects the packageManager-declared pnpm; keep pnpm's overlapping
# self-switcher off so the dependency lockfile stays a single YAML document.
pmOnFail: ignore

packages:
  - core
  - briefing
  - station
  - grib
  - j2k
  - forecast
  - site

versioning:
  # Packages remain pre-v1 until a deliberate stable release.
  maxBump: minor
  ignore:
    - meteo-platform
    - meteo-site
  changelog:
    storage: repository

allowBuilds:
  esbuild: true
  # Cloudflare's runtime binary, installed by wrangler (the site deploys
  # to Workers); its postinstall fetches the platform binary.
  workerd: true

overrides:
  # Miniflare pins undici 7.29.1 exactly, which is vulnerable to
  # GHSA-xjj6-f33q-929c, GHSA-4qv8-2p9j-2685 and GHSA-f72v-6w45-q472. Remove
  # this once wrangler's Miniflare pins 7.30.1 or later.
  "miniflare>undici@<7.30.1": 7.30.1

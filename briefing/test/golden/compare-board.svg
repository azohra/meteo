.meteo-board-note { fill: var(--meteo-board-ink-mute, #40565a); font-size: var(--meteo-board-text-note, 8.5px); font-style: italic; }
.meteo-board-cell { fill: var(--meteo-board-ink-soft, #2f454a); font-size: var(--meteo-board-text-cell, 10px); }
.meteo-board-cell-blank { fill: var(--meteo-board-ink-mute, #40565a); font-size: var(--meteo-board-text-cell, 10px); }
.meteo-board-cell-over { fill: var(--meteo-board-limit, #b3402e); font-size: var(--meteo-board-text-cell, 10px); font-weight: 700; }
.meteo-board-window { fill: var(--meteo-board-window, #2179ad); }
.meteo-board-window-clip { stroke: var(--meteo-board-window, #2179ad); fill: none; stroke-width: 1.2; }
.meteo-board-limit { fill: var(--meteo-board-limit, #b3402e); }
.meteo-board-limit-hatch-line { stroke: var(--meteo-board-limit, #b3402e); }
.meteo-board-cap { fill: var(--meteo-board-cap, #8a4a08); }
.meteo-board-cap-span { fill: var(--meteo-board-cap, #8a4a08); opacity: 0.3; }
.meteo-board-rain { fill: var(--meteo-board-rain, #207a83); stroke: var(--meteo-board-rain, #207a83); }

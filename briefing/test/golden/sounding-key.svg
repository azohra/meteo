.meteo-sounding-barb { stroke: var(--meteo-sounding-wind, #355963); }
.meteo-sounding-barb-fill { fill: var(--meteo-sounding-wind, #355963); stroke: var(--meteo-sounding-wind, #355963); }
.meteo-sounding-key-label { fill: var(--meteo-sounding-ink-mute, #40565a); font-size: var(--meteo-sounding-text-key-label, 10.5px); }
.meteo-sounding-key-band { fill: var(--meteo-sounding-ink-mute, #40565a); opacity: 0.16; }
.meteo-sounding-key-frame { fill: none; stroke: var(--meteo-sounding-rule, #776956); }

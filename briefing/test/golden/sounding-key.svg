.meteo-sounding-mark-boundary-label { fill: var(--meteo-sounding-boundary, #a46b10); }
.meteo-sounding-mark-cloud-base { stroke: var(--meteo-sounding-cloud-base, #355963); }
.meteo-sounding-mark-cloud-base-band { fill: var(--meteo-sounding-cloud-base, #355963); opacity: 0.14; }
.meteo-sounding-mark-cloud-base-label { fill: var(--meteo-sounding-cloud-base, #355963); }

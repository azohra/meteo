<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 179.5 38" role="img" aria-label="Sounding key: Model's published levels." class="meteo-sounding meteo-sounding-key">
<style>
.meteo-sounding text { font-family: var(--meteo-sounding-font, "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif); }

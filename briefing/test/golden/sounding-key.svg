.meteo-sounding-frame { fill: var(--meteo-sounding-surface, #fffdf8); stroke: var(--meteo-sounding-rule, #776956); }
.meteo-sounding-gridline { stroke: var(--meteo-sounding-rule, #776956); }
.meteo-sounding-tick { fill: var(--meteo-sounding-ink-mute, #40565a); font-size: var(--meteo-sounding-text-tick, 10.5px); }

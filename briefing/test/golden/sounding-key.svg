<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 603.2 64" role="img" aria-label="Sounding key: Temperature, Dew point, Lifted parcel, Published model level — count the dots, Boundary layer top, Cloud base, Usable lift top, Launch, LCL." class="meteo-sounding meteo-sounding-key">
<style>
.meteo-sounding text { font-family: var(--meteo-sounding-font, "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif); }

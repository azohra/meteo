# mise is the command surface for this repo: `mise tasks` lists the root
# verbs, `mise tasks --all` every package's.
#
# This is a mise MONOREPO ROOT: each package (core/, briefing/, station/,
# forecast/, grib/, j2k/) and the site (site/) carries its own mise.toml
# with its build/typecheck/test/check tasks, addressed as //core:build,
# //site:check, etc. — `cd core && mise run check` resolves the package's
# own check. Root tasks are the aggregates, the workspace shell's own
# gates, and the repo-wide doc gates.
#
#   mise run setup — frozen install + the commit gate hook
#   mise run build — every package dist, then the workspace shell
#   mise run check — the definition of green: every gate, one verb
#   mise run dev   — the site dev server (port derived per checkout)
#
# deploy and release are operator verbs and are not tracked here.

min_version = { soft = "2026.8.12" }
monorepo_root = true

# Secret-shaped env never appears in task output.
redactions = ["*_TOKEN", "*_API_KEY", "*_SECRET*"]

[monorepo]
config_roots = ["core", "briefing", "station", "forecast", "grib", "j2k", "site"]

[settings]
# package.json's packageManager is the one home for the pnpm version; a
# runner and anyone else's clone need this to read it.
idiomatic_version_file_enable_tools = ["pnpm"]
# Required for task result caching. NOTE the sharp edge: [settings] are
# invocation-global — this also enables experimental features for global
# tool resolution while running inside this repo.
experimental = true
# The check DAG fans out across seven package checks plus the doc gates;
# tasks are subprocess-bound, not mise-bound.
jobs = 8

[tool_config]
# Tools in this config root must resolve from the committed mise.lock.
# Scoped to this root only — unlike `settings.locked`, this cannot leak
# policy onto other repos.
locked = true

[tools]
node = "24"

[env]
_.path = ["./node_modules/.bin"]

# --- templates: the shared task shapes packages extend -----------------------
#
# Extenders with workspace dependencies restate `sources` in full (sources
# override wholesale) and add the dependency dists — a dependency's rebuild
# must invalidate this package's results. Checks declare outputs = [] with
# cache: a green result is stored content-addressed, so an unchanged
# package's gate is a cache hit, not a rerun.

[task_templates."pkg:build"]
description = "Build this package's dist with tsdown"
run = "pnpm exec tsdown"
sources = ["src/**", "tsdown.config.ts", "package.json", "../pnpm-lock.yaml"]
outputs = ["dist/**"]

[task_templates."pkg:typecheck"]
description = "Typecheck"
depends = ["build"]
run = "pnpm exec tsc -p tsconfig.json --noEmit"
outputs = []
cache = { enabled = true }

[task_templates."pkg:tests"]
description = "Test suite (cached green result)"
depends = ["build"]
run = "pnpm exec vitest run"
outputs = []
cache = { enabled = true }

[task_templates."pkg:test"]
description = "vitest with filters passing through (e.g. src/host.unit.test.ts)"
depends = ["build"]
run = "pnpm exec vitest run"

# --- setup and build ---------------------------------------------------------

[tasks.build]
description = "Build every package, then the workspace shell (skips when fresh)"
depends = [
  "//core:build",
  "//briefing:build",
  "//station:build",
  "//forecast:build",
  "//grib:build",
  "//j2k:build",
]
run = "tsdown"
sources = [
  "capabilities.ts",
  "internal/emit-schemas.ts",
  "tsdown.config.ts",
  "package.json",
  "pnpm-lock.yaml",
]
outputs = ["dist/**"]

# --- the shell's own gates ---------------------------------------------------

[tasks.lint]
description = "Format and lint gate (source readers; no build needed)"
run = "oxfmt --check . && oxlint ."
sources = [
  "*.ts",
  "*.mjs",
  "mise.toml",
  "*/mise.toml",
  ".oxlintrc.json",
  ".prettierignore",
  "core/src/**",
  "core/test/**",
  "briefing/src/**",
  "briefing/test/**",
  "station/src/**",
  "station/test/**",
  "forecast/src/**",
  "forecast/test/**",
  "grib/src/**",
  "grib/test/**",
  "j2k/src/**",
  "j2k/test/**",
  "*/tsdown.config.ts",
  "*/vitest.config.ts",
  "internal/**",
  "site/src/**",
  "site/test/**",
  "site/*.ts",
  "site/*.mjs",
  "scenarios/**",
]
outputs = []
cache = { enabled = true }

[tasks.typecheck]
description = "Typecheck the shell and every package"
depends = [
  "//core:typecheck",
  "//briefing:typecheck",
  "//station:typecheck",
  "//forecast:typecheck",
  "//grib:typecheck",
  "//j2k:typecheck",
]
run = "tsc -p tsconfig.json --noEmit"
sources = [
  "capabilities.ts",
  "tsconfig.json",
  "internal/**/*.ts",
  "package.json",
  "pnpm-lock.yaml",
  "core/dist/**",
  "briefing/dist/**",
  "station/dist/**",
  "forecast/dist/**",
]
outputs = []
cache = { enabled = true }

# The shell suite (internal/: boundaries, palette parity) reads package
# sources and manifests directly — they are inputs, not just the dists.
[tasks.tests]
hide = true
description = "Shell suite (cached green result)"
depends = ["build"]
run = "vitest run"
sources = [
  "internal/**",
  "capabilities.ts",
  "vitest.config.ts",
  "tsconfig.json",
  "package.json",
  "pnpm-lock.yaml",
  "*/package.json",
  "core/src/**",
  "briefing/src/**",
  "station/src/**",
  "forecast/src/**",
  "grib/src/**",
  "j2k/src/**",
  "station/styles.css",
  "site/src/**",
  "dist/**",
]
outputs = []
cache = { enabled = true }

[tasks.test]
description = "Shell and package suites (grib, j2k, and the site run in their own lanes)"
depends = ["tests", "//core:tests", "//briefing:tests", "//station:tests", "//forecast:tests"]

# --- repo-wide doc gates -------------------------------------------------------

# Links, structure, and quotes are separate tasks so the file-input
# gates cache; `content` stays the verb the battery names.
[tasks."content:links"]
hide = true
description = "Internal-link integrity across every reader-facing source"
run = "node internal/check-doc-links.mjs"
sources = [
  "internal/check-doc-links.mjs",
  "internal/lib/**",
  "site/src/**",
  "site/public/**",
  "README.md",
  "*/README.md",
  "*/CHANGELOG.md",
  "*/docs/**",
]
outputs = []
cache = { enabled = true }

[tasks."content:structure"]
hide = true
description = "Docs structure, labels, and orphans"
run = "node internal/check-docs-structure.mjs"
sources = [
  "internal/check-docs-structure.mjs",
  "internal/lib/**",
  "site/src/**",
  "README.md",
  "*/README.md",
  "*/CHANGELOG.md",
  "*/docs/**",
]
outputs = []
cache = { enabled = true }

[tasks."content:quotes"]
hide = true
description = "Straight-quote convention across every reader-facing source"
run = "node internal/check-quotes.mjs"
sources = [
  "internal/check-quotes.mjs",
  "internal/lib/**",
  "site/src/**",
  "README.md",
  "*/README.md",
  "*/CHANGELOG.md",
  "*/docs/**",
]
outputs = []
cache = { enabled = true }

[tasks.content]
description = "Doc links, structure, and the quote convention (source readers)"
depends = ["content:links", "content:structure", "content:quotes"]

[tasks."figures:check"]
description = "Doc figures match their authored sources"
depends = ["build"]
run = "node internal/generate-doc-figures.mjs --check"
sources = [
  "internal/**",
  "scenarios/**",
  "site/assets/**",
  "site/public/**",
  "site/src/assets/**",
  "site/package.json",
  "readme-hero.svg",
  "readme-meteogram.svg",
  "package.json",
  "pnpm-lock.yaml",
  "dist/**",
  "core/dist/**",
  "briefing/dist/**",
  "station/dist/**",
  "forecast/dist/**",
  "grib/dist/**",
  "j2k/dist/**",
]
outputs = []
cache = { enabled = true }

[tasks.figures]
description = "Regenerate the authored doc figures"
depends = ["build"]
run = "node internal/generate-doc-figures.mjs"

[tasks."station-assets:check"]
description = "Station assets match their sources"
depends = ["build"]
run = "node internal/generate-station-assets.mjs --check"
sources = [
  "internal/generate-station-assets.mjs",
  "internal/lib/**",
  "station/styles.css",
  "station/docs/figures/**",
  "station/dist/**",
  "core/dist/**",
  "package.json",
  "pnpm-lock.yaml",
]
outputs = []
cache = { enabled = true }

[tasks."station-assets"]
description = "Regenerate station assets"
depends = ["build"]
run = "node internal/generate-station-assets.mjs"

[tasks."doc-fences:check"]
description = "Doc code fences compile against the built packages"
depends = ["build"]
run = "node internal/check-doc-fences.mjs"
sources = [
  "internal/check-doc-fences.mjs",
  "internal/lib/**",
  "site/src/content/**",
  "README.md",
  "*/README.md",
  "*/docs/**",
  "*/package.json",
  "tsconfig.json",
  "package.json",
  "pnpm-lock.yaml",
  "dist/**",
  "core/dist/**",
  "briefing/dist/**",
  "station/dist/**",
  "forecast/dist/**",
  "grib/dist/**",
  "j2k/dist/**",
]
outputs = []
cache = { enabled = true }

[tasks."schemas:check"]
description = "Emitted schemas match their sources"
depends = ["build"]
run = "node dist/internal/emit-schemas.js --check"
sources = [
  "internal/emit-schemas.ts",
  "capabilities.ts",
  "*/schema/**",
  "package.json",
  "pnpm-lock.yaml",
  "dist/**",
  "core/dist/**",
  "briefing/dist/**",
  "station/dist/**",
  "forecast/dist/**",
  "grib/dist/**",
  "j2k/dist/**",
]
outputs = []
cache = { enabled = true }

[tasks.schemas]
description = "Re-emit the schema artifacts"
depends = ["build"]
run = "node dist/internal/emit-schemas.js"

[tasks."scenarios:check"]
description = "Scenario outputs match their definitions"
depends = ["build"]
run = "node internal/scenarios.mjs check"
sources = [
  "internal/scenarios.mjs",
  "internal/lib/**",
  "scenarios/**",
  "package.json",
  "pnpm-lock.yaml",
  "dist/**",
  "core/dist/**",
  "briefing/dist/**",
  "station/dist/**",
  "forecast/dist/**",
  "grib/dist/**",
  "j2k/dist/**",
]
outputs = []
cache = { enabled = true }

[tasks."scenarios:generate"]
description = "Regenerate scenario outputs"
depends = ["build"]
run = "node internal/scenarios.mjs generate"

# --- aggregates ----------------------------------------------------------------

[tasks.check]
description = "The definition of green: every gate, one command"
depends = [
  "lint",
  "content",
  "figures:check",
  "station-assets:check",
  "doc-fences:check",
  "typecheck",
  "test",
  { task = "//...:check" },
]

# Doctrine-facing lanes: the documented standalone commands for the long
# suites and the site gates, resolving to the package tasks that own them.
[tasks."test:grib"]
hide = true
run = [{ task = "//grib:tests" }]

[tasks."test:j2k"]
hide = true
run = [{ task = "//j2k:tests" }]

[tasks."site:check"]
hide = true
run = [{ task = "//site:check" }]

[tasks."site:test"]
hide = true
run = [{ task = "//site:e2e" }]

[tasks.dev]
description = "Site dev server; port derived per checkout (flags pass through)"
dir = "site"
raw_args = true
run = """
#!/usr/bin/env bash
set -euo pipefail
# Every checkout derives its port from its path — stable per checkout,
# no fixed ports, no registry.
n=$(pwd | cksum | cut -d' ' -f1)
port=$((4400 + n % 4000))
unsafe=" 4045 5060 5061 6000 6566 6665 6666 6667 6668 6669 6679 6697 "
while [[ "$unsafe" == *" $port "* ]]; do port=$((port + 1)); done
exec pnpm exec astro dev --port "$port" "$@"
"""

[tasks.deploy]
description = "Deploy the site at merged main"
confirm = "Deploy meteo.azohra.com to production?"
timeout = "10m"
usage = 'flag "--dry-run" help="Validate without shipping"'
run = """
#!/usr/bin/env bash
set -euo pipefail
[ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "deploy: refusing — CLOUDFLARE_API_TOKEN is unset" >&2; exit 1; }
[ "$(git rev-parse --git-dir)" = "$(git rev-parse --git-common-dir)" ] || { echo "deploy: refusing — deploy runs only from the main checkout" >&2; exit 1; }
[ -z "$(git status --porcelain)" ] || { echo "deploy: refusing — tree is dirty" >&2; exit 1; }
git fetch -q origin main
# FETCH_HEAD, not origin/main: a CI checkout has no remote-tracking ref.
[ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ] || { echo "deploy: refusing — HEAD is not landed origin/main" >&2; exit 1; }
mise run check
# The worker is site/; everything below runs there so the deploy and the
# question that verifies it address the same wrangler config.
cd site
if [ "${usage_dry_run:-false}" = "true" ]; then
  pnpm exec wrangler deploy --dry-run
  echo "deploy: dry run complete — nothing shipped"
  exit 0
fi
tag="$(git rev-parse --short HEAD)"
pnpm exec wrangler deploy --tag "$tag" --message "$(git log -1 --pretty=%s)"
# Cloudflare is the authority on which version serves traffic. The public URL
# cannot answer it: bot protection 403s a datacenter IP on some zones and not
# others, so a status code there means nothing consistent.
python3 - "$tag" <<'VERIFY'
import json, subprocess, sys

def wrangler(*args):
    r = subprocess.run(["pnpm", "exec", "wrangler", *args, "--json"], capture_output=True, text=True)
    if r.returncode:
        sys.exit(f"deploy: {' '.join(args)} failed — {r.stderr.strip()[:200]}")
    return json.loads(r.stdout)

want = sys.argv[1]
active = wrangler("deployments", "list")[-1]["versions"][0]["version_id"]
got = next((v["annotations"].get("workers/tag", "") for v in wrangler("versions", "list") if v["id"] == active), "")
if got != want:
    sys.exit(f"deploy: refusing — version {active} serving traffic carries tag {got!r}, expected {want!r}")
print(f"deploy: live — {active} serving 100%, tagged {want}")
VERIFY
"""

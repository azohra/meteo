version: 2
updates:
  - package-ecosystem: github-actions
    labels: ["dependencies"]
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Vancouver
    open-pull-requests-limit: 5
    cooldown:
      default-days: 1
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: npm
    labels: ["dependencies"]
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Vancouver
    open-pull-requests-limit: 5
    cooldown:
      default-days: 1
    # @types/node follows the oldest Node the packages support (engines
    # >=22), so packages cannot use an API that release lacks. A Node major
    # is a change of its own.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-production-minor-patch:
        patterns: ["*"]
        dependency-type: production
        update-types: [minor, patch]
      npm-development-minor-patch:
        patterns: ["*"]
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: fix
      prefix-development: build
      include: scope

# j2k tasks. No workspace dependencies; the decoder suite is a long lane.

[tasks.build]
extends = "pkg:build"

[tasks.typecheck]
extends = "pkg:typecheck"
sources = ["src/**", "test/**", "tsconfig.json", "package.json", "../pnpm-lock.yaml"]

[tasks.tests]
extends = "pkg:tests"
hide = true
sources = [
  "src/**",
  "test/**",
  "vitest.config.ts",
  "tsconfig.json",
  "package.json",
  "../pnpm-lock.yaml",
]

[tasks.test]
extends = "pkg:test"
raw_args = true

[tasks.check]
description = "j2k typecheck + tests (the decoder suite)"
depends = ["typecheck", "tests"]
